name: ci

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: codebuild-${{ vars.AWS_RUNNER_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
      
      - name: Configure NPM Authentication
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_PUBLISH_TOKEN }}" > ~/.npmrc
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login --username arjundoelcurve --password-stdin
      
      - name: Pull MongoDB Docker Image
        run: docker pull mongo:8.0.11
      
      - name: Start MongoDB Container
        run: docker run -d -p 27017:27017 --name mongodb mongo:8.0.11
      
      - name: Wait for MongoDB to be Ready
        run: sleep 5
      
      - name: Run Linting
        run: npm run lint
      
      - name: Run Jest Tests
        run: npm run test:jest
      
      - name: Run Mocha Tests
        run: npm run test:unit

      - name: Run Mocha Integration Tests
        run: npm run test:int

      - name: Run Mocha Periods Tests
        run: npm run test:periods
