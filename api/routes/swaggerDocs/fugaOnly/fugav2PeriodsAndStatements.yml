        year:
          type: integer
        accountingPeriod:
          type: string
        accountingPeriodType:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        accountingDate:
          type: string
          format: date
        status:
          type: string
        contractType:
          type: string
        runNo:
          type: integer
        locked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        calculationStatus:
          type: string
        grossAmount:
          type: number
        grossCosts:
          type: number
        netAmount:
          type: number
        netCosts:
          type: number
        totalContractsForCalculation:
          type: integer
        processEndTime:
          type: string
          format: date-time
        fuga:
          type: string

    FugaStatement:
      type: object
      properties:
        sendings:
          type: object
        locked:
          type: boolean
        _id:
          type: string
        clientId:
          type: string
        periodId:
          type: string
        contractId:
          type: string
        payeeName:
          type: string
        name:
          type: string
        date:
          type: string
          format: date-time
        year:
          type: integer
        accountingPeriod:
          type: string
        periodType:
          type: string
        status:
          type: string
        salesFilesIds:
          type: array
          items:
            type: string
        costIds:
          type: array
          items:
            type: string
        releaseIds:
          type: array
          items:
            type: string
        trackIds:
          type: array
          items:
            type: string
        workIds:
          type: array
          items:
            type: string
        openingBalance:
          type: number
        units:
          type: number
        grossAmount:
          type: number
        netAmount:
          type: number
        grossCosts:
          type: number
        netCosts:
          type: number
        reservesWithheld:
          type: number
        reservesReleased:
          type: number
        netOutput:
          type: number
        closingBalance:
          type: number
        lines:
          type: integer
        invalidLines:
          type: integer
        profitShareRate:
          type: number
        profitShareNetAmount:
          type: number
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
        contractType:
          type: string
        pdf:
          type: string
        statementOfAccount:
          type: string
        salesCsv:
          type: string
        costsCsv:
          type: string
        allFilesZip:
          type: string
        salesCsvPublicLink:
          type: string
        costsCsvPublicLink:
          type: string
        pdfPublicLink:
          type: string
        statementOfAccountPublicLink:
          type: string
        allFilesZipPublicLink:
          type: string
