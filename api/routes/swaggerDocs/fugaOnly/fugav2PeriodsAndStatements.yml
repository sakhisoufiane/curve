openapi: 3.0.0
paths:
  /fuga/v2/periods:
    get:
      tags:
        - "Fuga v2 - Periods"
      summary: Retrieve periods
      description: Returns a paginated list of periods. Requires read access to periods.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
          description: Number of items per page
      responses:
        '200':
          description: Successfully retrieved periods
          content:
            application/json:
              schema:
                type: object
                properties:
                  periods:
                    type: array
                    items:
                      $ref: '#/components/schemas/FugaPeriod'
                  meta:
                    $ref: '#/components/schemas/FugaPaginationMeta'
        '403':
          $ref: '#/components/responses/FugaForbidden'
        '500':
          $ref: '#/components/responses/FugaInternalError'

  /fuga/v2/periods/{id}:
    get:
      tags:
        - "Fuga v2 - Periods"
      summary: Retrieve a specific period
      description: Returns details for a specific period by ID. Requires read access to periods.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
      responses:
        '200':
          description: Successfully retrieved period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FugaPeriod'
        '403':
          $ref: '#/components/responses/FugaForbidden'
        '404':
          $ref: '#/components/responses/FugaNotFound'
        '500':
          $ref: '#/components/responses/FugaInternalError'

    put:
      tags:
        - "Fuga v2 - Periods"
      summary: Update a period
      description: Updates a period's blocked status by ID. Requires write access to periods.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blockedStatus:
                  type: boolean
                message:
                  type: string
      responses:
        '200':
          description: Successfully updated period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FugaPeriod'
        '400':
          $ref: '#/components/responses/FugaBadRequest'
        '403':
          $ref: '#/components/responses/FugaForbidden'
        '404':
          $ref: '#/components/responses/FugaNotFound'
        '500':
          $ref: '#/components/responses/FugaInternalError'

  /fuga/v2/periods/{id}/statements:
    get:
      tags:
        - "Fuga v2 - Periods"
      summary: Retrieve statements for a period
      description: Returns a paginated list of statements for a specific period. Requires read access to periods.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
          description: Number of items per page
      responses:
        '200':
          description: Successfully retrieved statements
          content:
            application/json:
              schema:
                type: object
                properties:
                  statements:
                    type: array
                    items:
                      $ref: '#/components/schemas/FugaStatement'
                  meta:
                    $ref: '#/components/schemas/FugaPaginationMeta'
        '403':
          $ref: '#/components/responses/FugaForbidden'
        '404':
          $ref: '#/components/responses/FugaNotFound'
        '500':
          $ref: '#/components/responses/FugaInternalError'

  /fuga/v2/periods/{id}/publish_all_statements:
    post:
      tags:
        - "Fuga v2 - Periods"
      summary: Publish all statements for a period
      description: Publishes all statements for a specific period. Requires read access to periods.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
      responses:
        '200':
          description: Successfully published all statements
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Statements have all been published and sent to payees."
        '403':
          $ref: '#/components/responses/FugaForbidden'
        '404':
          $ref: '#/components/responses/FugaNotFound'
        '500':
          $ref: '#/components/responses/FugaInternalError'

  /fuga/v2/periods/{id}/email_all_statements:
    post:
      tags:
        - "Fuga v2 - Periods"
      summary: Email all statements for a period
      description: Emails all statements for a specific period. Requires read access to periods.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emailAddresses:
                  type: array
                  items:
                    type: string
                  description: Email addresses to send statements to
      responses:
        '200':
          description: Successfully emailed all statements
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "The statements will be sent to you shortly."
        '400':
          $ref: '#/components/responses/FugaBadRequest'
        '403':
          $ref: '#/components/responses/FugaForbidden'
        '404':
          $ref: '#/components/responses/FugaNotFound'
        '500':
          $ref: '#/components/responses/FugaInternalError'

  /fuga/v2/periods/{id}/email_summary:
    post:
      tags:
        - "Fuga v2 - Periods"
      summary: Email period summary
      description: Emails a summary for a specific period. Requires read access to periods.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emailAddresses:
                  type: array
                  items:
                    type: string
                  description: Email addresses to send summary to
      responses:
        '200':
          description: Successfully emailed summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "The file will be sent to you shortly."
        '400':
          $ref: '#/components/responses/FugaBadRequest'
        '403':
          $ref: '#/components/responses/FugaForbidden'
        '404':
          $ref: '#/components/responses/FugaNotFound'
        '500':
          $ref: '#/components/responses/FugaInternalError'

  /fuga/v2/client/statements:
    get:
      tags:
        - "Fuga v2 - Statements"
      summary: Retrieve client statements
      description: Returns a paginated list of client statements. Requires read access to periods.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
          description: Number of items per page
      responses:
        '200':
          description: Successfully retrieved statements
          content:
            application/json:
              schema:
                type: object
                properties:
                  statements:
                    type: array
                    items:
                      $ref: '#/components/schemas/FugaStatement'
                  meta:
                    $ref: '#/components/schemas/FugaPaginationMeta'
        '403':
          $ref: '#/components/responses/FugaForbidden'
        '500':
          $ref: '#/components/responses/FugaInternalError'

  /fuga/v2/client/statements/{id}:
    get:
      tags:
        - "Fuga v2 - Statements"
      summary: Retrieve a specific client statement
      description: Returns details for a specific client statement by ID. Requires read access to periods.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Statement ID
      responses:
        '200':
          description: Successfully retrieved statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FugaStatement'
        '403':
          $ref: '#/components/responses/FugaForbidden'
        '404':
          $ref: '#/components/responses/FugaNotFound'
        '500':
          $ref: '#/components/responses/FugaInternalError'

