  /contracts/{id}/active_advances:
    get:
      tags:
        - Contracts
      summary: Retrieve active advance recoupment status for a specific Contract
      description: This route retrieves the active advance tracking information for a specific Contract, including the overall balance, completed recoupments, and current recoupment cycle details at a given point in time.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "6c0ef989427a6638a9b3727c"
          required: true
          description: The ID of the Contract to retrieve active advances for.
        - in: query
          name: date
          schema:
            type: string
            format: date-time
          description: The point-in-time date for calculating active advances. Defaults to the current date if not provided.
      responses:
        '200':
          description: Successfully retrieved the active advance recoupment status for the Contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveAdvance'
        '400':
          description: Bad request, invalid date format or unsupported contract type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Profit Share contracts do not track advance recoupment"
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Forbidden"
        '404':
          description: Contract not found, no Contract exists with the specified ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Could not find Contract with ID 6c0ef989427a6638a9b3727c"
        '500':
          description: Internal server error occurred while trying to retrieve the active advances for the Contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal error, please try again"
  /contracts/{id}/add_alias:
    put:
      tags:
        - Contracts
      summary: Add an alias to a Contract
      description: This route allows adding an alias to a specific Contract by its ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "6c0ef989427a6638a9b3727c"
          required: true
          description: The ID of the Contract to add an alias to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    alias:
                      type: string
                      example: "New Alias"
                - type: object
                  properties:
                    aliases:
                      type: array
                      items:
                        type: string
                        example: ["Alias 1", "Alias 2"]
      responses:
        '200':
          description: Successfully added the alias to the Contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Alias added"
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Contract not found, no Contract exists with the specified ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error occurred while trying to add the alias to the Contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /contracts/raw-export:
    post:
      tags:
        - Contracts
      summary: Raw CSV Export of Contracts
      description: |
        Export contracts data to a raw CSV file. By default, the export is processed asynchronously
        and a notification email is sent when complete. When sync=true, the request waits for
        the export to complete and returns the download URL directly in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: false
                  description: |
                    If true, waits for export to complete and returns download URL directly.
                    If false (default), sends notification email when export is ready.
                filter:
                  type: object
                  description: Filter object to select contracts for export.
                  properties:
                    text:
                      type: string
                      description: Text search filter for name, labels, foreignId, etc.
                    contractType:
                      type: string
                      enum: ["Standard", "Mechanical", "All"]
                      description: Filter by contract type.
                    valid:
                      type: boolean
                      description: Filter by validity status.
                    createdAfter:
                      type: string
                      format: date
                      description: Filter for contracts created on or after this date. Date-only values use start of day UTC.
                      example: "2025-01-01"
                    createdBefore:
                      type: string
                      format: date
                      description: Filter for contracts created on or before this date. Date-only values use end of day UTC.
                      example: "2025-12-31"
                    updatedAfter:
                      type: string
                      format: date
                      description: Filter for contracts updated on or after this date. Date-only values use start of day UTC.
                      example: "2025-01-01"
                    updatedBefore:
                      type: string
                      format: date
                      description: Filter for contracts updated on or before this date. Date-only values use end of day UTC.
                      example: "2025-12-31"
      responses:
        '200':
          description: |
            When sync=false (default): Export process started successfully, email notification will be sent.
            When sync=true: Export completed, returns download URL (expires in 24 hours).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Your report will be sent to you via email shortly"
                    description: Response when sync=false (default)
                  - type: object
                    properties:
                      csvPublicLink:
                        type: string
                        format: uri
                        example: "https://s3.amazonaws.com/bucket/raw_exports/Client-contracts%20raw%20export%2020260120133708304.csv"
                    description: Response when sync=true
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error occurred while processing the export.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                    description: Error details (only returned when sync=true)

