      responses:
        '200':
          description: Successfully retrieved the Contract statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    balance:
                      type: number
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error occurred while trying to retrieve the Contract statuses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string'
