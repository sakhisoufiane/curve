  /contracts/{id}/transactions:
    get:
      tags:
        - Contracts
      summary: Retrieve Transactions for a specific Contract
      description: >
        Retrieves the Transactions associated with a specific Contract by its ID.
        When the `page` query parameter is provided, returns a paginated response
        including a `meta` object with pagination details. Without `page`, returns
        all transactions as a flat list.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "6c0ef989427a6638a9b3727c"
          required: true
          description: The ID of the Contract to retrieve Transactions for.
        - in: query
          name: page
          schema:
            type: number
          description: The page number for pagination. When provided, the response includes a `meta` object. Defaults to 1.
        - in: query
          name: limit
          schema:
            type: number
          description: The number of transactions to return per page. Defaults to 25. Only applies when `page` is provided.
      responses:
        '200':
          description: Successfully retrieved the Transactions for the Contract.
          content:
            application/json:
              schema:
                oneOf:
                  - description: Non-paginated response (when `page` query param is omitted).
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Transaction'
                            - type: object
                              properties:
                                balance:
                                  type: number
                                  description: Running balance of the contract at the time of this transaction, calculated from the contract's opening balance.
                  - description: Paginated response (when `page` query param is provided).
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Transaction'
                            - type: object
                              properties:
                                balance:
                                  type: number
                                  description: Running balance of the contract at the time of this transaction, calculated from the contract's opening balance.
                      meta:
                        type: object
                        properties:
                          currentPage:
                            type: number
                            example: 1
                          totalPages:
                            type: number
                            example: 4
                          total:
                            type: number
                            example: 87
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Forbidden"
        '404':
          description: Contract not found, no Contract exists with the specified ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Could not find Contract with ID 6c0ef989427a6638a9b3727c"
        '500':
          description: Internal server error occurred while trying to retrieve the Transactions for the Contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal error, please try again"
