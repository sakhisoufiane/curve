openapi: 3.1.0
info:
  title: Contracts API
  version: 1.10.0
paths:
  /contracts:
    get:
      tags:
        - Contracts
      summary: Retrieve a list of Contracts
      description: This route retrieves a list of Contracts based on the provided filters.
      parameters:
        - in: query
          name: text
          schema:
            type: string
          description: The text to be searched.
        - in: query
          name: page
          schema:
            type: number
          description: The page number for pagination, defaults to 1.
        - in: query
          name: limit
          schema:
            type: number
          description: The number of items to return per page, defaults to 25.
        - in: query
          name: orderBy
          schema:
            type: string
            enum: ["name", "type", "createdAt"]
          description: The field to order by.
        - in: query
          name: orderDir
          schema:
            type: string
            enum: ["asc", "desc"]
          description: The direction to order by.
        - in: query
          name: createdAfter
          schema:
            type: string
            format: date
          description: Filter contracts created on or after this date (inclusive, YYYY-MM-DD format)
        - in: query
          name: createdBefore
          schema:
            type: string
            format: date
          description: Filter contracts created on or before this date (inclusive, YYYY-MM-DD format)
        - in: query
          name: updatedAfter
          schema:
            type: string
            format: date
          description: Filter contracts updated on or after this date (inclusive, YYYY-MM-DD format)
        - in: query
          name: updatedBefore
          schema:
            type: string
            format: date
          description: Filter contracts updated on or before this date (inclusive, YYYY-MM-DD format)
      responses:
        '200':
          description: Successfully retrieved the list of Contracts, returns Contracts along with metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contracts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                        description: Current page number.
                      totalPages:
                        type: integer
                        description: Total number of pages available.
                      total:
                        type: integer
                        description: Total number of Contracts available.
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error occurred while trying to retrieve the Contracts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      tags:
        - Contracts
      summary: Create a new Contract
      description: This route allows for the creation of a new Contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractInput'
        responses:
        '200':
          description: Successfully created the Contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error occurred while trying to save the Contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    delete:
      tags:
        - Contracts
      summary: Delete one or multiple Contracts
      description: This route allows for the deletion of multiple Contracts, specified by their IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  example: ["620a912lz295e377a20a13z2", "684bbda7a4eb464a2ac3cb80"]
                type:
                  type: string
                  description: Deletion type, it can be 'multi'. Defaults to 'multi' if not specified.
                  hidden: true
      responses:
        '200':
          description: Successfully deleted the Contracts, returns the result of the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '201':
          description: Indicates that some or all Contracts are attached to other data which needs to be deleted first, returns a message indicating the issue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Forbidden, the user does not have sufficient rights to perform the deletion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Not found, the specified Contracts could not be found, returns a message indicating the issue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error occurred while trying to delete the Contracts, returns a message indicating an internal error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /contracts/{id}:
    get:
      tags:
        - Contracts
      summary: Retrieve a specific Contract by ID
      description: This route retrieves a specific Contract by its ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "6c0ef989427a6638a9b3727c"
          required: true
          description: The ID of the Contract to retrieve.
      responses:
        '200':
          description: Successfully retrieved the Contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Forbidden"
        '404':
          description: Contract not found, no Contract exists with the specified ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Could not find Contract with ID 6c0ef989427a6638a9b3727c"
        '500':
          description: Internal server error occurred while trying to retrieve the Contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal error, please try again"
    put:
      tags:
        - Contracts
      summary: Update single Contract
      description: This route finds and updates a specific Contract by its ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "6c0ef989427a6638a9b3727c"
          required: true
          description: The ID of the Contract to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractInput'
      responses:
        '200':
          description: Successfully updated the Contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Contract not found, no Contract exists with the specified ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error occurred while trying to update the Contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /contracts/{id}/history:
    get:
      tags:
        - Contracts
      summary: Retrieve Contract history
      description: This route retrieves the history of a specific Contract by its ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: "6c0ef989427a6638a9b3727c"
          required: true
          description: The ID of the Contract to retrieve history for.
      responses:
        '200':
          description: Successfully retrieved the Contract history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modelHistory:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                        clientId:
                          type: string
                        author:
                          type: object
                          properties:
                            _id:
                              type: string
                            email:
                              type: string
                        ops:
                          type: array
                          items:
                            type: object
                            properties:
                              op:
                                type: string
                                example: replace
                              path:
                                type: string
                                example: /name
                              value:
                                type: string
                                example: New Contract Name
                                nullable: true
                              originalValue:
                                type: string
                                example: Old Contract Name
                                nullable: true
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Contract not found, no Contract exists with the specified ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error occurred while trying to retrieve the Contract history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
