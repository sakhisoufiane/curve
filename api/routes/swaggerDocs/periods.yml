          required: true
          schema:
            type: string
          description: Period ID
          example: "650938707c29f69000d7a6d5"
      responses:
        200:
          description: Successfully retrieved batch tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchTasks:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        status:
                          type: string
                        taskType:
                          type: string
                        progress:
                          type: number
                        startTime:
                          type: string
                          format: date-time
