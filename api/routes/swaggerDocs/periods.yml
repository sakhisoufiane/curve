openapi: 3.0.3
info:
  title: Periods API
  version: '1.0.0'
  description: |
    API for managing accounting periods in the system.
    Supports CRUD operations on periods with access control validation.
    Includes support for period status, calculations, and associations.
    
    Access Control:
    - Read access requires period read permissions
    - Write access requires period write permissions
    - Admin users can access all periods
    - Payee users can only access published periods associated with their contracts

paths:
  /periods:
    get:
      tags:
        - "Periods"
      summary: Retrieve a list of Periods
      description: |
        Retrieves a paginated list of periods with complex access control:
        - Admin users: All periods with full filtering
        - Payee users: Only published periods associated with their contracts
        - Text search supports regex patterns and 24-character ObjectId validation
      parameters:
        - in: query
          name: orderBy
          required: false
          schema:
            type: string
            enum: ["name","year","accountingPeriod","grossAmount","grossCosts","createdAt","status","calculationStatus","runNo","updatedAt"]
            example: name
          description: Field to sort results by
        - in: query
          name: orderDir
          required: false
          schema:
            type: string
            enum: ["asc","desc"]
            example: asc
          description: Sort direction
        - in: query
          name: page
          required: false
          schema:
            type: number
            example: 1
          description: Page number for pagination
        - in: query
          name: limit
          required: false
          schema:
            type: number
            example: 25
            maximum: 100
          description: Number of items per page
        - in: query
          name: text
          required: false
          schema:
            type: string
            example: "Period Name"
          description: |
            Search text to filter periods by name. Supports regex patterns for name searches.
            If exactly 24 characters, will also search by ObjectId for exact matches.
      responses:
        200:
          description: Successfully retrieved periods with access control applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  periods:
                    type: array
                    items:
                      $ref: '#/components/schemas/Period'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - "Periods"
      summary: Create a new Period
      description: Creates a new period with validation and automatic setup. Requires admin write access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodInput'
      responses:
        200:
          description: Successfully created period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        400:
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /periods/{id}:
    get:
      tags:
        - "Periods"
      summary: Retrieve a specific Period
      description: Returns details for a specific period by ID with access control validation.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
          example: "650938707c29f69000d7a6d5"
      responses:
        200:
          description: Successfully retrieved period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - "Periods"
      summary: Update a Period
      description: Updates a period by ID with validation and access control. Requires admin write access.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
          example: "650938707c29f69000d7a6d5"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodInput'
      responses:
        200:
          description: Successfully updated period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        400:
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - "Periods"
      summary: Delete a Period
      description: Deletes a period by ID. Requires admin write access and period must be in Draft status.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
          example: "650938707c29f69000d7a6d5"
      responses:
        200:
          description: Successfully deleted period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /periods/{id}/detail:
    get:
      tags:
        - "Periods"
      summary: Retrieve detailed Period information
      description: |
        Returns comprehensive period details including sales files, costs, statements, and calculation statistics.
        Access control applied based on user type.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
          example: "650938707c29f69000d7a6d5"
      responses:
        200:
          description: Successfully retrieved detailed period information
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    $ref: '#/components/schemas/Period'
                  salesFiles:
                    type: array
                    items:
                      type: object
                  costs:
                    type: array
                    items:
                      type: object
                  statements:
                    type: array
                    items:
                      type: object
                  calculationStats:
                    type: object
                    properties:
                      totalLines:
                        type: number
                      validLines:
                        type: number
                      invalidLines:
                        type: number
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /periods/{id}/history:
