  /periods/raw-export:
    post:
      tags:
        - Periods
      summary: Raw CSV Export of Periods
      description: |
        Export periods data to a raw CSV file. By default, the export is processed asynchronously
        and a notification email is sent when complete. When sync=true, the request waits for
        the export to complete and returns the download URL directly in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: false
                  description: |
                    If true, waits for export to complete and returns download URL directly.
                    If false (default), sends notification email when export is ready.
                filter:
                  type: object
                  description: Filter object to select periods for export.
                  properties:
                    text:
                      type: string
                      description: Text search filter for period name.
                    accountingPeriodType:
                      type: string
                      description: Filter by accounting period type.
                      enum: ["Monthly", "Quarterly", "Half-Yearly", "Yearly"]
                    accountingPeriod:
                      type: string
                      description: Filter by accounting period.
                      enum: ["Y1","H1","H2","Q1","Q2","Q3","Q4","M1","M2","M3","M4","M5","M6","M7","M8","M9","M10","M11","M12","Custom"]
                    contractType:
                      type: string
                      description: Filter by contract type.
                    year:
                      type: number
                      description: Filter by year.
                    createdAfter:
                      type: string
                      format: date
                      description: Filter for periods created on or after this date. Date-only values use start of day UTC.
                      example: "2025-01-01"
                    createdBefore:
                      type: string
                      format: date
                      description: Filter for periods created on or before this date. Date-only values use end of day UTC.
                      example: "2025-12-31"
                    updatedAfter:
                      type: string
                      format: date
                      description: Filter for periods updated on or after this date. Date-only values use start of day UTC.
                      example: "2025-01-01"
                    updatedBefore:
                      type: string
                      format: date
                      description: Filter for periods updated on or before this date. Date-only values use end of day UTC.
                      example: "2025-12-31"
      responses:
        '200':
          description: |
            When sync=false (default): Export process started successfully, email notification will be sent.
            When sync=true: Export completed, returns download URL (expires in 24 hours).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Your report will be sent to you via email shortly"
                    description: Response when sync=false (default)
                  - type: object
                    properties:
                      csvPublicLink:
                        type: string
                        format: uri
                        example: "https://s3.amazonaws.com/bucket/raw_exports/Client-periods%20raw%20export%2020260120133708304.csv"
                    description: Response when sync=true
        '403':
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Internal server error occurred while processing the export.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                    description: Error details (only returned when sync=true)

components:
  schemas:
    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: number
        totalPages:
          type: number
        total:
          type: number

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    Period:
      type: object
      properties:
        _id:
          type: string
        clientId:
          type: string
        name:
          type: string
        setupStage:
          type: string
          description: Current setup stage of the period
        year:
          type: number
        accountingPeriod:
          type: string
          enum: ["Y1","H1","H2","Q1","Q2","Q3","Q4","M1","M2","M3","M4","M5","M6","M7","M8","M9","M10","M11","M12","Custom"]
        accountingPeriodType:
          type: string
          enum: ["Yearly","Half-Yearly","Quarterly","Monthly"]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        accountingDate:
          type: string
          format: date-time
        forceFull:
          type: boolean
          default: false
        status:
          type: string
          enum: ["Draft","Processing","Complete","Deleting","Error"]
        contractType:
          type: string
          enum: ["Standard","Mechanical","MCPS"]
          default: "Standard"
        calculationStatus:
          type: string
          description: Current calculation step status
        calculationError:
          type: object
          description: Error details if calculation fails
        processStartTime:
          type: string
          format: date-time
        processEndTime:
          type: string
          format: date-time
        units:
          type: number
        grossAmount:
          type: number
        netAmount:
          type: number
        grossCosts:
          type: number
        netCosts:
          type: number
        lines:
          type: number
        valid:
          type: number
          description: Number of valid calculation lines
        invalidLines:
          type: number
          description: Number of invalid calculation lines
        salesFilesIds:
          type: array
          items:
            type: string
          description: Array of associated sales file IDs
        costIds:
          type: array
          items:
            type: string
          description: Array of associated cost IDs
        runNo:
          type: number
          default: 0
          description: Period run number for recalculations
        locked:
          type: boolean
          description: Whether period is locked for editing
        createdBy:
          type: string
          description: User ID who created the period
        lastModifiedBy:
          type: string
          description: User ID who last modified the period
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PeriodInput:
      type: object
      required:
        - name
        - year
        - accountingPeriod
        - startDate
        - endDate
      properties:
        name:
          type: string
          description: Name of the period
        year:
          type: number
          description: Year for the period
        accountingPeriod:
          type: string
          enum: ["Y1","H1","H2","Q1","Q2","Q3","Q4","M1","M2","M3","M4","M5","M6","M7","M8","M9","M10","M11","M12","Custom"]
          description: Accounting period type
        accountingPeriodType:
          type: string
          enum: ["Yearly","Half-Yearly","Quarterly","Monthly"]
          description: Type of accounting period
        startDate:
          type: string
          format: date-time
          description: Start date of the period
        endDate:
          type: string
          format: date-time
          description: End date of the period
        accountingDate:
          type: string
          format: date-time
          description: Accounting date for the period
        contractType:
          type: string
          enum: ["Standard","Mechanical","MCPS"]
          default: "Standard"
          description: Type of contracts for the period
        forceFull:
          type: boolean
          default: false
          description: Whether to force full calculation
        currencyExchangeRates:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              rate:
                type: number
          description: Currency exchange rates for the period