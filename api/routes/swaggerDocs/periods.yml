      summary: Retrieve Period history
      description: Returns the modification history for a specific period.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Period ID
          example: "650938707c29f69000d7a6d5"
      responses:
        200:
          description: Successfully retrieved period history
          content:
            application/json:
              schema:
                type: object
                properties:
                  modelHistory:
                    type: array
                    items:
                      type: object
                      properties:
                        ops:
                          type: array
                          items:
                            type: object
                            properties:
                              op:
                                type: string
                              path:
                                type: string
                              value:
                                type: string
                        _id:
                          type: string
                        ref:
                          type: string
                        author:
                          type: object
                          nullable: true
                        timestamp:
                          type: string
                          format: date-time
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
