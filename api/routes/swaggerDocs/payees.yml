openapi: 3.0.3
info:
  title: Payees API
  version: '1.0.0'
  description: |
    API for managing payee records in the system.
    Supports CRUD operations on payees with access control validation.
    Includes support for payee details, associations, and status management.
    
    Access Control:
    - Read access requires payee read permissions
    - Write access requires payee write permissions
    - Client users can only access payees in their organization
    - Payee users can only access their own records

paths:
  /payees:
    get:
      tags:
        - "Payees"
      summary: Retrieve a list of Payees
      description: |
        This route retrieves a list of Payees based on the provided filters. Supports both regex text search and exact ObjectId matching.

        **Sensitive Data Handling:**
        Only client admin users can view or update sensitive fields (contactEmail, address, bankName, bankAddress, accountNo, sortCode, iban, swiftCode, paymentEmail, paymentProviders.wise.paymentFields).
      parameters:
        - in: query
          name: text
          schema:
            type: string
          description: Filter on supplied text string. Searches across name, alternateName, foreignId, and projectId fields using regex patterns. If the text is exactly 24 characters (valid ObjectId format), it will also search for exact _id matches.
        - in: query
          name: name
          schema:
            type: string
          description: Filter by Payee name (exact match)
        - in: query
          name: page
          schema:
            type: number
          description: The page number for pagination, defaults to 1.
        - in: query
          name: limit
          schema:
            type: number
          description: The number of items to return per page, defaults to 25.
        - in: query
          name: orderBy
          required: false
          schema:
            type: string
            enum: ["name", "payeeCategories", "createdAt"]
            example: name
          description: The field by which to sort the results.
        - in: query
          name: orderDir
          required: false
          schema:
            type: string
            enum: ["asc", "desc"]
            example: asc
          description: The direction to sort the results.
        - in: query
          name: createdAfter
          schema:
            type: string
            format: date
          description: Filter payees created on or after this date (inclusive, YYYY-MM-DD format)
        - in: query
          name: createdBefore
          schema:
            type: string
            format: date
          description: Filter payees created on or before this date (inclusive, YYYY-MM-DD format)
        - in: query
          name: updatedAfter
          schema:
            type: string
            format: date
          description: Filter payees updated on or after this date (inclusive, YYYY-MM-DD format)
        - in: query
          name: updatedBefore
          schema:
            type: string
            format: date
          description: Filter payees updated on or before this date (inclusive, YYYY-MM-DD format)
      responses:
        200:
          description: Retrieves a list of Payees
          content:
            application/json:
              schema:
                type: object
                properties:
                  payees:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payee'
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: number
                      totalPages:
                        type: number
                      total:
                        type: number
              example:
                payees:
                  - _id: "string"
                    clientId: "string"
                    name: "Example Payee"
                    alternateName: "EP"
                    openingBalance: 0
                    minPayout: 0
                    selfBilling: false
                    autoPayment: false
                    payeeCategories: []
                    paymentProviders:
                      curvePay: {}
                      tipalti:
                        crossPayeeDetails: false
                        payeeId: "string"
                      wise:
                        feesPaidBy: "client"
                    createdBy: null
                    lastModifiedBy: "string"
                    valid: true
                    validationErrors: []
                    createdAt: "2024-01-01T00:00:00.000Z"
                    updatedAt: "2025-01-01T00:00:00.000Z"
                    __v: 0
                    paymentCurrency: "GBP"
                    payeeBalanceCurrency: "GBP"
                meta:
                  currentPage: 1
                  totalPages: 1
                  total: 25
        400:
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        403:
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to retrieve the Payee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      tags:
        - "Payees"
      summary: Create a new Payee
      description: |
        This route allows for the creation of a new Payee.

        **Sensitive Data Handling:**
        Only client admin users can view or update sensitive fields (contactEmail, address, bankName, bankAddress, accountNo, sortCode, iban, swiftCode, paymentEmail, paymentProviders.wise.paymentFields).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                alternateName:
                  type: string
                foreignId:
                  type: string
                contactEmail:
                  type: string
                country:
                  type: string
                address:
                  type: string
                vatNo:
                  type: string
                notes:
                  type: string
                selfBillingTaxText:
                  type: string
                selfBillingTaxRate:
                  type: number
                feesInvoiceTaxRate:
                  type: number
                withholdingTaxRate:
                  type: number
                payeeCategories:
                  type: array
                  items:
                    type: string
                  description: Needs to match categories set up in Settings area
      responses:
        200:
          description: Successfully created the Payee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
              example:
                clientId: "string"
                name: "test from API"
                alternateName: "MJ"
                openingBalance: 0
                minPayout: 0
                selfBilling: false
                autoPayment: false
                payeeCategories: []
                paymentProviders:
                  curvePay: {}
                  tipalti:
                    crossPayeeDetails: false
                    payeeId: "string"
                  wise:
                    feesPaidBy: "client"
                    paymentFields: {}
                createdBy: "string"
                lastModifiedBy: "string"
                valid: false
                validationErrors:
                  - "Payee should be linked to at least one Contract"
                  - "A User needs to be assigned in order for someone to have access to this Payee and view its statements. It is ok to wait with creating Users until you are ready to send statements"
                _id: "string"
                updatedAt: "2025-04-15T11:42:03.914Z"
                createdAt: "2025-04-15T11:42:03.914Z"
                __v: 0
        403:
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to save the Payee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /payees/{id}:
    get:
      tags:
        - "Payees"
      summary: Retrieve a specific Payee by ID
      description: |
        This route retrieves a specific Payee by its ID.

        **Sensitive Data Handling:**
        Only client admin users can view or update sensitive fields (contactEmail, address, bankName, bankAddress, accountNo, sortCode, iban, swiftCode, paymentEmail, paymentProviders.wise.paymentFields).
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: 5c9fe8d3921a4527b9b43773
          required: true
          description: The ID of the Payee to retrieve.
      responses:
        200:
          description: Successfully retrieved the Payee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payee'
              example:
                _id: "1a2b3c4d5e6f7g8h9i4j1k1l"
                clientId: "9j8h7g6f5d4s4z1s3c9d9x42"
                name: "Test Payee"
                payeeCategories: []
                foreignId: "789012"
                projectId: "1a2b3c4d5e6f7g8h9i0j1k2l"
                country: "WW"
                vatNo: ""
                selfBillingTaxRate: 20
                withholdingTaxRate: 17.5
                paymentProviders:
                  tipalti:
                    payeeId: "1a2b3c4d5e6f7g8h9i0j1k2l"
                  wise:
                    paymentFields: {}
                    recipientDetailsMethod: "manual"
                createdBy: "4a8s8c7d8e9f0g1h1e3j4k5l"
                lastModifiedBy: "4a8s8c7d8e9f0g1h1e3j4k5l"
                valid: false
                validationErrors:
                  - "A User needs to be assigned in order for someone to have access to this Payee and view its statements. It is ok to wait with creating Users until you are ready to send statements"
                  - "Payee should be linked to at least one Contract"
                createdAt: "2023-02-20T15:13:52.345Z"
                updatedAt: "2023-03-03T11:02:51.751Z"
        403:
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Payee not found, no Payee exists with the specified ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to retrieve the Payee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    put:
      tags:
        - "Payees"
      summary: Update single Payee
      description: |
        This route finds and updates a specific Payee by its ID.

        **Sensitive Data Handling:**
        Only client admin users can view or update sensitive fields (contactEmail, address, bankName, bankAddress, accountNo, sortCode, iban, swiftCode, paymentEmail, paymentProviders.wise.paymentFields).
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: 5c9fe8d3921a4527b9b43773
          required: true
          description: The ID of the Payee to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                alternateName:
                  type: string
                foreignId:
                  type: string
                contactEmail:
                  type: string
                country:
                  type: string
                address:
                  type: string
                vatNo:
                  type: string
                notes:
                  type: string
                selfBillingTaxText:
                  type: string
                selfBillingTaxRate:
                  type: number
                feesInvoiceTaxRate:
                  type: number
                withholdingTaxRate:
                  type: number
                payeeCategories:
                  type: array
                  items:
                    type: string
                  description: Needs to match categories set up in Settings area
      responses:
        200:
          description: Successfully updated the Payee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
              example:
                clientId: "string"
                name: "string"
                alternateName: "string"
                openingBalance: 0
                minPayout: 0
                selfBilling: false
                autoPayment: false
                payeeCategories: []
                paymentProviders:
                  curvePay: {}
                  tipalti:
                    crossPayeeDetails: false
                    payeeId: "string"
                  wise:
                    feesPaidBy: "client"
                    paymentFields: {}
                createdBy: "string"
                lastModifiedBy: "string"
                valid: false
                validationErrors:
                  - "Payee should be linked to at least one Contract"
                  - "A User needs to be assigned in order for someone to have access to this Payee and view its statements. It is ok to wait with creating Users until you are ready to send statements"
                _id: "string"
                updatedAt: "2025-04-15T11:42:03.914Z"
                createdAt: "2025-04-15T11:42:03.914Z"
                __v: 0
        403:
          description: Forbidden, the user does not have sufficient rights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Payee not found, no Payee exists with the specified ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to update the Payee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    delete:
      tags:
        - "Payees"
      summary: Delete single Payee
      description: This route allows for the deletion of one Payee, specified by ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: 5c9fe8d3921a4527b9b43773
          required: true
          description: The ID of the Payee to delete.
      responses:
        200:
          description: Successfully deleted the Payee, returns the result of the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
              example:
                clientId: "string"
                name: "string"
                alternateName: "string"
                openingBalance: 0
                minPayout: 0
                selfBilling: false
                autoPayment: false
                payeeCategories: []
                paymentProviders:
                  curvePay: {}
                  tipalti:
                    crossPayeeDetails: false
                    payeeId: "string"
                  wise:
                    feesPaidBy: "client"
                    paymentFields: {}
                createdBy: "string"
                lastModifiedBy: "string"
                valid: false
                validationErrors:
                  - "Payee should be linked to at least one Contract"
                  - "A User needs to be assigned in order for someone to have access to this Payee and view its statements. It is ok to wait with creating Users until you are ready to send statements"
                _id: "string"
                updatedAt: "2025-04-15T11:42:03.914Z"
                createdAt: "2025-04-15T11:42:03.914Z"
                __v: 0
        201:
          description: Indicates an internal error whilst attempting to delete the Payee.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        403:
          description: Forbidden, the user does not have sufficient rights to perform the deletion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Not found, the specified Payee could not be found, returns a message indicating the issue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to delete the Payee, returns a message indicating an internal error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /payees/bulk:
    delete:
      tags:
        - "Payees"
      summary: Delete multiple Payees
      description: This route allows for the deletion of multiple Payees in a single request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payees:
                  type: array
                  items:
                    type: string
                  description: Array of Payee IDs to delete
      responses:
        200:
          description: Successfully deleted Payees
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "X Payees have been deleted"
        400:
          description: Bad request - invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to delete the Payees
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /payees/{id}/history:
    get:
      tags:
        - "Payees"
      summary: Retrieve Payee History
      description: This route retrieves the history of a specific Payee.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the Payee to retrieve history for
      responses:
        200:
          description: Successfully retrieved Payee history
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        change:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        createdBy:
                          type: string
                        createdByName:
                          type: string
                        action:
                          type: string
                        payeeName:
                          type: string
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to retrieve the Payee history
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /payees/{id}/summary:
    get:
      tags:
        - "Payees"
      summary: Retrieve Payee Summary
      description: This route retrieves the summary information of a specific Payee.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the Payee to retrieve summary for
      responses:
        200:
          description: Successfully retrieved Payee summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                  transactions:
                    type: number
                  contracts:
                    type: number
                  statements:
                    type: number
                  lastPayment:
                    type: string
                    format: date-time
                  paymentCount:
                    type: number
                  totalPaid:
                    type: number
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to retrieve the Payee summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /payees/{id}/detail:
    get:
      tags:
        - "Payees"
      summary: Retrieve detailed Payee information
      description: This route retrieves detailed information of a specific Payee including contracts, transactions, and summary data.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the Payee to retrieve details for
      responses:
        200:
          description: Successfully retrieved detailed Payee information
          content:
            application/json:
              schema:
                type: object
                properties:
                  payee:
                    $ref: '#/components/schemas/Payee'
                  summary:
                    type: object
                    properties:
                      balance:
                        type: number
                      transactions:
                        type: number
                      contracts:
                        type: number
                      statements:
                        type: number
                  contracts:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        amount:
                          type: number
                        date:
                          type: string
                          format: date-time
                        type:
                          type: string
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to retrieve the Payee details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /payees/{id}/users:
    get:
      tags:
        - "Payees"
      summary: Retrieve Users associated with a Payee
      description: This route retrieves all Users that are associated with a specific Payee.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the Payee to retrieve Users for
      responses:
        200:
          description: Successfully retrieved Users associated with the Payee
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                        active:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        lastLogin:
                          type: string
                          format: date-time
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to retrieve the Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /payees/import:
    post:
      tags:
        - "Payees"
      summary: Import Payees from file
      description: |
        This route allows for importing Payees from an uploaded file (CSV/Excel).

        **Sensitive Data Handling:**
        Only client admin users can import or update sensitive fields (contactEmail, address, bankName, bankAddress, accountNo, sortCode, iban, swiftCode, paymentEmail, paymentCurrency, paymentProviders, paymentProviders.wise.paymentFields).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to import Payees from (CSV or Excel format)
      responses:
        200:
          description: Successfully imported Payees
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  imported:
                    type: number
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row:
                          type: number
                        error:
                          type: string
        400:
          description: Bad request - invalid file or format
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to import the Payees
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /payees/raw-export:
    post:
      tags:
        - "Payees"
      summary: Raw Export Payees to CSV
      description: |
        This route allows for exporting Payees directly from the database to a CSV file.
        Only accessible to client users with View or Edit contract permissions.
        
        **Sensitive Data Handling:**
        All sensitive fields are always excluded from the export, including encrypted fields and client admin only fields (contactEmail, address, bankName, bankAddress, accountNo, sortCode, iban, swiftCode, paymentEmail, paymentCurrency, paymentProviders, paymentProviders.wise.paymentFields).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync:
                  type: boolean
                  default: false
                  description: When true, returns the CSV download link directly instead of sending via email
                filter:
                  type: object
                  description: Filter criteria for selecting payees
                  properties:
                    text:
                      type: string
                      description: Filter on supplied text string
                    name:
                      type: string
                      description: Filter by Payee name
                    createdAfter:
                      type: string
                      format: date
                      description: Filter payees created on or after this date (YYYY-MM-DD)
                    createdBefore:
                      type: string
                      format: date
                      description: Filter payees created on or before this date (YYYY-MM-DD)
                    updatedAfter:
                      type: string
                      format: date
                      description: Filter payees updated on or after this date (YYYY-MM-DD)
                    updatedBefore:
                      type: string
                      format: date
                      description: Filter payees updated on or before this date (YYYY-MM-DD)
      responses:
        200:
          description: Raw export request submitted successfully
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Your report will be sent to you via email shortly"
                  - type: object
                    properties:
                      csvPublicLink:
                        type: string
                        example: "https://example.com/export.csv"
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to export the Payees
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /payees/export:
    post:
      tags:
        - "Payees"
      summary: Export Payees to file
      description: |
        This route allows for exporting Payees to a file format that will be sent via email.
        Only accessible to client users with View contract permissions.

        **Sensitive Data Handling:**
        Only client admin users can export sensitive fields (contactEmail, address, bankName, bankAddress, accountNo, sortCode, iban, swiftCode, paymentEmail, paymentCurrency, paymentProviders, paymentProviders.wise.paymentFields).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Array of specific Payee IDs to export. If not provided, uses filter criteria.
                filter:
                  type: object
                  description: Filter criteria for selecting payees when specific IDs are not provided
      responses:
        200:
          description: Export request submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Your report will be sent to you via email shortly"
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to export the Payees
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

