  /payees/{id}/transactions:
    get:
      tags:
        - "Payees"
      summary: Retrieve Transactions for a Payee
      description: This route retrieves all transactions associated with a specific Payee with pagination support.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the Payee to retrieve transactions for
        - in: query
          name: page
          schema:
            type: number
            default: 1
          description: The page number for pagination
        - in: query
          name: limit
          schema:
            type: number
            default: 25
          description: The number of transactions to return per page
      responses:
        200:
          description: Successfully retrieved transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        amount:
                          type: number
                        date:
                          type: string
                          format: date-time
                        type:
                          type: string
                        description:
                          type: string
                        status:
                          type: string
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: number
                      totalPages:
                        type: number
                      total:
                        type: number
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while trying to retrieve transactions
