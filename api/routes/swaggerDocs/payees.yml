  /payees/{id}/create_wise_recipient:
    post:
      tags:
        - "Payees"
      summary: Create Wise recipient for a Payee
      description: This route creates a Wise recipient account for a specific Payee to enable Wise payments.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the Payee to create Wise recipient for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountHolderName:
                  type: string
                  description: The name of the account holder
                currency:
                  type: string
                  description: The currency for the recipient account
                type:
                  type: string
                  enum: ["email", "iban", "sort_code"]
                  description: The type of recipient account
                details:
                  type: object
                  description: Account details specific to the recipient type
                  properties:
                    email:
                      type: string
                    iban:
                      type: string
                    sortCode:
                      type: string
                    accountNumber:
                      type: string
      responses:
        200:
          description: Successfully created Wise recipient
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipientId:
                    type: string
                    description: The Wise recipient ID
                  accountHolderName:
                    type: string
                  currency:
                    type: string
                  type:
                    type: string
                  details:
                    type: object
                  createdAt:
                    type: string
                    format: date-time
        400:
          description: Bad request - invalid recipient data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        403:
          description: Forbidden, the user does not have sufficient rights
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Payee not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          description: Internal server error occurred while creating Wise recipient
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  schemas:
    Payee:
      type: object
      properties:
        _id:
          type: string
          description: Unique identifier for the Payee
        clientId:
          type: string
          description: The client ID this Payee belongs to
        name:
          type: string
          description: The name of the Payee
        alternateName:
          type: string
          description: An alternate name for the Payee
        foreignId:
          type: string
          description: External system identifier for the Payee
        projectId:
          type: string
          description: Project identifier associated with the Payee
        contactEmail:
          type: string
          format: email
          description: Contact email address for the Payee
        country:
          type: string
          description: Country code for the Payee
        address:
          type: string
          description: Physical address of the Payee
        vatNo:
          type: string
          description: VAT number for the Payee
        notes:
          type: string
          description: Additional notes about the Payee
        openingBalance:
          type: number
          description: The opening balance for the Payee
        minPayout:
          type: number
          description: Minimum payout amount for the Payee
        selfBilling:
          type: boolean
          description: Whether self-billing is enabled for this Payee
        autoPayment:
          type: boolean
          description: Whether automatic payments are enabled
        selfBillingTaxText:
          type: string
          description: Tax text for self-billing invoices
        selfBillingTaxRate:
          type: number
          description: Tax rate for self-billing invoices
        feesInvoiceTaxRate:
          type: number
          description: Tax rate for fees invoices
        withholdingTaxRate:
          type: number
          description: Withholding tax rate for the Payee
        payeeCategories:
          type: array
          items:
            type: string
          description: Categories assigned to the Payee
        paymentProviders:
          type: object
          properties:
            curvePay:
              type: object
              description: CurvePay payment provider configuration
            tipalti:
              type: object
              properties:
                crossPayeeDetails:
                  type: boolean
                payeeId:
                  type: string
              description: Tipalti payment provider configuration
            wise:
              type: object
              properties:
                feesPaidBy:
                  type: string
                  enum: ["client", "payee"]
                paymentFields:
                  type: object
              description: Wise payment provider configuration
        createdBy:
          type: string
          description: ID of the user who created the Payee
        lastModifiedBy:
          type: string
          description: ID of the user who last modified the Payee
        valid:
          type: boolean
          description: Whether the Payee data is valid
        validationErrors:
          type: array
          items:
            type: string
          description: List of validation errors for the Payee
        createdAt:
          type: string
          format: date-time
          description: Date and time when the Payee was created
        updatedAt:
          type: string
          format: date-time
          description: Date and time when the Payee was last updated
        __v:
          type: number
          description: Version key for the document
        paymentCurrency:
          type: string
          description: Currency used for payments to this Payee
        payeeBalanceCurrency:
          type: string
          description: Currency used for the Payee's balance
