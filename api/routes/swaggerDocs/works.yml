components:
  schemas:
    IpChain:
      type: object
      properties:
        composerId:
          type: string
        publisherId:
          type: string
        contractType:
          type: string
        controlled:
          type: boolean
        mechanicalOwnership:
          type: number
        mechanicalCollection:
          type: number
        performanceOwnership:
          type: number
        performanceCollection:
          type: number
        children:
          type: array
          items:
            $ref: '#/components/schemas/IpChain'
    Work:
      type: object
      properties:
        clientId:
          type: string
        campaignIds:
          type: array
          items:
            type: string
        title:
          type: string
          required: true
        alternateTitles:
          type: array
          items:
            properties:
              title:
                type: string
              language:
                type: string
                enum: ['', 'English', 'Arabic', 'Assamese', 'Aymara', 'Azerbaijani', 'Bashkir', 'Basque', 'Bengali', 'Bhutani', 'Bihari', 'Bislama', 'Breton', 'Bulgarian', 'Burmese', 'Byelorussian', 'Cambodian', 'Catalan', 'Chinese', 'Corsican', 'Croatian', 'Czech', 'Danish', 'Dutch', 'Esperanto', 'Estonian', 'Faeroese', 'Farsi', 'Fiji', 'Finnish', 'French', 'Frisian', 'Galician', 'Georgian', 'German', 'Greek', 'Greenlandic', 'Guarani', 'Gujarati', 'Hausa', 'Hawaii', 'Hebrew', 'Hindi', 'Hungarian', 'Icelandic', 'Indonesian', 'Interlingua', 'Interlingue', 'Inupiak', 'Irish', 'Italian', 'Japanese', 'Javanese', 'Kannada', 'Kashmiri', 'Kazakh', 'Kinyarwanda', 'Kirghiz', 'Kirundi', 'Korean', 'Kurdish', 'Laothian', 'Latin', 'Latvian', 'Lingala', 'Lithuanian', 'Macedonian', 'Malagasy', 'Malay', 'Malayalam', 'Maltese', 'Maori', 'Marathi', 'Moldavian', 'Mongolian', 'Nauru', 'Ndebele', 'Nepali', 'North Sotho', 'Norwegian', 'Occitan', 'Oriya', 'Oromo', 'Papiamento', 'Pashto', 'Polish', 'Portuguese', 'Punjabi', 'Quechua', 'Rhaeto-Romance', 'Romanian', 'Russian', 'Samoan', 'Sangro', 'Sanskrit', 'Scots Gaelic', 'Serbian', 'Serbo-Croatian', 'Sesotho', 'Setswana', 'Shona', 'Sindhi', 'Singhalese', 'Siswati', 'Slovak', 'Slovenian', 'Somali', 'Spanish', 'Sudanese', 'Swahili', 'Swedish', 'Tagalog', 'Tajik', 'Tamil', 'Tatar', 'Telugu', 'Thai', 'Tibetan', 'Tigrinya', 'Tonga', 'Tsonga', 'Turkish', 'Turkmen', 'Twi', 'Ukranian', 'Urdu', 'Uzbek', 'Venda', 'Vietnamese', 'Volapuk', 'Welsh', 'Wolof', 'Xhosa', 'Yiddish', 'Yoruba', 'Zulu']
        composer:
          type: string
        foreignId:
          type: string
        projectId:
          type: string
        identifier:
          type: string
        partyNo:
          type: number
        tunecode:
          type: string
        iswc:
          type: string
        notes:
          type: string
        trackIds:
          type: array
          description: Should match a track that exists
          items:
            type: string
        salesReturnsRights:
          type: array
          items:
            type: object
            properties:
              contractId:
                type: string
              percentage:
                type: number
        salesReturnsRightsDisplay:
          type: array
        channelSpecificSalesReturnsRights:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
              territory:
                type: string
              source:
                type: string
              contractId:
                type: string
              percentage:
                type: number
        costsRights:
          type: array
          items:
            type: object
            properties:
              contractId:
                type: string
              percentage:
                type: number
        aliases:
          type: array
          items:
            type: string
        societyIdentifiers:
          type: array
          items:
            properties:
              society:
                type: string
              identifier:
                type: number
        contractValidation:
          type: string
        duplicatedFrom:
          type: string
        territories:
          type: array
          items:
            type: string
        rightsChain:
          type: array
          items:
            properties:
              territory:
                type: string
              children:
                type: array
                items:
                  $ref: '#/components/schemas/IpChain'
              totalMechanicalOwnership:
                type: number
              totalPerformanceOwnership:
                type: number
              totalMechanicalCollection:
                type: number
              totalPerformanceCollection:
                type: number
              territoryCodes:
                type: object
                properties:
                  name:
                    type: string
                  codes:
                    type: array
                    items:
                      type: string
        usedComposerIds:
          type: array
          items:
            type: string
        usedPublisherIds:
          type: array
          items:
            type: string
        catalogueGroups:
          type: array
          items:
            type: string
        grandRights:
          type: boolean
        priority:
          type: boolean
        productionLibrary:
          type: boolean
        workLanguage:
          type: string
        workDescriptionCategory:
          type: string
        duration:
          type: number
          description: In seconds
        compositeType:
          type: string
          enum: ['', 'None', 'Composite of Samples', 'Medley', 'Potpourri', 'Unspecified']
        compositeCount:
          type: number
        versionType:
          type: string
          enum: ['', 'Original Work', 'Modification']
        arrangementType:
          type: string
          enum: ['', 'Original', 'New Music Added', 'Arrangement', 'Addition of Music to Text', 'Unspecified']
        lyricAdaptionType:
          type: string
          enum: ['', 'Original', 'None', 'New Lyrics Added', 'Modification', 'Replaced', 'Addition of Lyrics to Music', 'Translation', 'Unspecified']
        originalWorkTitle:
          type: string
        originalIswc:
          type: string
        originalWorkWriterLastName:
          type: string
        originalWorkWriterFirstName:
          type: string
        originalWorkSource:
          type: string
        performers:
          type: array
          description: List of names of performers
          items:
            type: string
        submitterWorkNos:
          type: object
        valid:
          type: boolean
          default: false
        validationErrors:
          type: array
          items:
            type: string
        approvalStatus:
          type: string
          default: 'Invalid'
        approvedDate:
          type: string
          format: date-time
        onHold:
          type: boolean
          default: false
        totalCollection:
          type: object
          description: 'Auto-generated based on detail in Rights Chain'
          properties:
            totalOwnedMechanical:
              type: number
              default: 0
            totalOwnedPerformance:
              type: number
              default: 0
        totalParticipation:
          description: 'Auto-generated based on detail in Rights Chain'
          type: number
          default: 0
        createdBy:
          type: string
          format: uuid
        lastModifiedBy:
          type: string
          format: uuid
        identifierNo:
          type: number
        copyrightDate:
          type: string
          format: date-time
        labelCopy:
          type: string
        significantUpdateDate:
          type: string
          description: 'Auto-generated based on changes of Work'
          format: date
        deliveredTo:
          type: array
          items:
            type: object
            properties:
              deliveryPartnerId:
                type: string
                format: uuid
              deliveredAt:
                type: string
                format: date-time
        forceRedelivery:
          type: array
          items:
            type: string
            format: uuid
        holdRedelivery:
          type: array
          items:
            type: string
            format: uuid
        inFutureDelivery:
          type: array
          items:
            type: string
            format: uuid
