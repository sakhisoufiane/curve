openapi: 3.0.3
info:
  title: Publishers API
  version: 1.0.0
  description: |
    API for managing publisher records in the system.
    Supports CRUD operations on publishers with access control validation.
    Includes support for PRO affiliations, territories, and agreements.
    
    Access Control:
    - Read access requires catalogue read permissions
    - Write access requires catalogue write permissions
    - Client users can only access publishers in their organization

paths:
  /publishers:
    get:
      tags:
        - Publishers
      summary: Retrieve a list of publishers
      description: Retrieve publishers based on provided filters and pagination settings.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
          description: Number of items per page.
        - in: query
          name: orderBy
          schema:
            type: string
            enum: [name, createdAt, updatedAt]
          description: Field to sort by.
        - in: query
          name: orderDir
          schema:
            type: string
            enum: [asc, desc]  
          description: Sorting direction.
        - in: query
          name: text
          schema:
            type: string
          description: Search term for publisher names, IDs, or interested party IDs.
      responses:
        200:
          description: List of publishers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Publisher"
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer  
                      total:
                        type: integer
              example:
                publishers:
                  - _id: "507f1f77bcf86cd799439011"
                    name: "Example Publisher"
                    cae: "123456789"
                    controlled: true
                    linkedContracts: []
                    createdAt: "2024-01-01T00:00:00.000Z"
                    updatedAt: "2024-01-01T00:00:00.000Z"
                meta:
                  currentPage: 1
                  totalPages: 1
                  total: 25
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Publishers
      summary: Create a new publisher
      description: Add a new publisher record to the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherInput"
      responses:
        200:
          description: Publisher created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publisher"
              example:
                _id: "507f1f77bcf86cd799439011"
                name: "New Publisher"
                cae: "123456789"
                foreignId: "EXT123"
                partyNo: 6
                controlled: true
                linkedContracts: []
                createdBy: "507f1f77bcf86cd799439012"
                lastModifiedBy: "507f1f77bcf86cd799439012"
                createdAt: "2024-01-01T00:00:00.000Z"
                updatedAt: "2024-01-01T00:00:00.000Z"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Publishers
      summary: Bulk delete publishers
      description: |
        Delete multiple publishers by IDs with validation for dependencies. Only accessible to client users with Edit catalogue permissions.
        - Validates that publishers are not in use by works, tracks, releases, or composers
        - Supports different deletion types (multi, force, etc.)
        - Returns detailed validation results for each publisher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Array of publisher IDs to delete
                type:
                  type: string
                  default: "multi"
                  description: Type of deletion operation
      responses:
        200:
          description: Bulk deletion completed with results
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Bulk deletion completed"
                  results:
                    type: array
                    items:
                      type: object
                      description: Deletion result for each publisher
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/InternalError"

  /publishers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: The unique identifier of the publisher.
    
    get:
      tags:
        - Publishers
      summary: Retrieve a specific publisher
      description: Get detailed information about a specific publisher.
      responses:
        200:
          description: Publisher details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publisher"
              example:
                _id: "507f1f77bcf86cd799439011"
                name: "Example Publisher"
                cae: "123456789"
                foreignId: "EXT123"
                partyNo: 6
                controlled: true
                linkedContracts: [
                  {
                    contractId: "507f1f77bcf86cd799439013"
                  }
                ]
                societies: [
                  {
                    society: "PRS",
                    identifier: "123456",
                    publisherName: "Example Publisher Ltd"
                  }
                ]
                territories: ["GB", "US", "CA"]
                createdBy: "507f1f77bcf86cd799439012"
                lastModifiedBy: "507f1f77bcf86cd799439012"
                createdAt: "2024-01-01T00:00:00.000Z"
                updatedAt: "2024-01-01T00:00:00.000Z"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Publishers
      summary: Update a publisher
      description: Update details of an existing publisher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherInput"
      responses:
        200:
          description: Publisher updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publisher"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalError"

  /publishers/{id}/history:
    get:
      tags:
        - Publishers
      summary: Get publisher history
      description: Retrieve the modification history of a publisher.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The unique identifier of the publisher.
      responses:
        200:
          description: Publisher history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  modelHistory:
                    type: array
                    items:
                      type: object
                      properties:
                        ref:
                          type: string
                        author:
                          type: object
                          properties:
                            email:
                              type: string
                        modifiedBy:
                          type: string
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalError"

  /publishers/export:
    post:
      tags:
        - Publishers
      summary: Export publishers
      description: Export publishers to a file that will be sent via email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientType
              properties:
                ids:
                  type: array
                  items:
                    type: string
                filter:
                  type: object
                clientType:
                  type: string
      responses:
        200:
          description: Export initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        403:
          $ref: "#/components/responses/Forbidden"

  /publishers/raw-export:
    post:
      tags:
        - Publishers
      summary: Raw export publishers
      description: |
        Export publishers to a raw CSV file. By default, the export is processed asynchronously
        and a notification email is sent when complete. When sync=true, the request waits for
        the export to complete and returns the download URL directly in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clientType
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Array of publisher IDs to export. If not provided, uses filter criteria.
                filter:
                  type: object
                  description: Filter criteria for selecting publishers when specific IDs are not provided
                clientType:
                  type: string
                  description: Type of client for export processing
                sync:
                  type: boolean
                  default: false
                  description: |
                    If true, waits for export to complete and returns download URL directly.
                    If false (default), sends notification email when export is ready.
      responses:
        200:
          description: |
            When sync=false (default): Export process started successfully, email notification will be sent.
            When sync=true: Export completed, returns download URL (expires in 24 hours).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Your report will be sent to you via email shortly"
                    description: Response when sync=false (default)
                  - type: object
                    properties:
                      csvPublicLink:
                        type: string
                        format: uri
                        example: "https://s3.amazonaws.com/bucket/raw_exports/Client-publishers%20raw%20export.csv"
                    description: Response when sync=true
        403:
          $ref: "#/components/responses/Forbidden"

  /publishers/import:
    post:
      tags:
        - Publishers
      summary: Import publishers
      description: Import publishers from an Excel file.
      parameters:
        - in: query
          name: overwriteBlanks
          schema:
            type: boolean
          description: Whether to overwrite blank fields.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                clientType:
                  type: string
      responses:
        200:
          description: Import initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        403:
          $ref: "#/components/responses/Forbidden"

