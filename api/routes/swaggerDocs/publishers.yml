        publisherAgreements:
          type: array
          items:
            type: object
            properties:
              publisherId:
                type: string
                description: ID of the related publisher
              agreementType:
                type: string
                enum: ["Subpublishing General", "Subpublishing Specific"]
              territory:
                type: string
