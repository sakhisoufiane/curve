        _id:
          type: string
          description: Unique identifier for the publisher.
        clientId:
          type: string
          description: Client identifier associated with the publisher.
        foreignId:
          type: string
          description: External identifier for the publisher.
        partyNo:
          type: number
          description: Auto-assigned party number.
        name:
          type: string
          description: The name of the publisher.
        lowerCaseName:
          type: string
          description: Auto-generated lowercase name for search purposes.
        cae:
          type: string
          description: CAE or IPI number of the publisher.
        caeWithoutLeadingZeros:
          type: string
          description: CAE or IPI number without leading zeros.
        aliases:
          type: array
          items:
            type: string
          description: |
            Alternate names that will resolve to this publisher.
            Aliases cannot be empty. Each alias must be unique (case-insensitive)
