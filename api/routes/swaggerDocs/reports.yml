openapi: 3.0.3
info:
  title: Reports API
  version: 1.0.0

paths:
  /reports:
    get:
      tags:
        - "Reports"
      summary: Retrieve reports
      description: Returns a list of reports with pagination.
      parameters:
        - in: query
          name: text
          schema:
            type: string
          description: Filter on supplied text string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number to return
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
          description: Number of items to return per page
        - in: query
          name: orderBy
          schema:
            type: string
          description: Column to order by
        - in: query
          name: orderDir
          schema:
            type: string
            enum: [asc, desc]
          description: Order direction
      responses:
        200:
          description: Successfully retrieved reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      total:
                        type: integer
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags:
        - "Reports"
      summary: Create a report
      description: Creates a new report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        200:
          description: Successfully created report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/InternalServerError'

  /reports/{id}:
    get:
      tags:
        - "Reports"
      summary: Retrieve a specific report
      description: Returns details for a specific report by ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Report ID
      responses:
        200:
          description: Successfully retrieved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/ReportNotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - "Reports"
      summary: Update a report
      description: Updates a report by ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Report ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        200:
          description: Successfully updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/ReportNotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - "Reports"
      summary: Delete a report
      description: Deletes a report by ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Report ID
      responses:
        200:
          description: Successfully deleted report
          content:
            application/json:
              schema:
                type: object
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/ReportNotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

  /reports/{id}/export:
    get:
      tags:
        - "Reports"
      summary: Export a report
      description: Exports a report to the user's email.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Report ID
      responses:
        200:
          description: Successfully initiated report export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/ReportNotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

  /reports/{id}/exportFixedReport:
    get:
      tags:
        - "Reports"
      summary: Export a fixed report
      description: Exports a fixed report to the user's email.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Report ID
      responses:
        200:
          description: Successfully initiated fixed report export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/ReportNotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

  /reports/{id}/display:
    get:
      tags:
        - "Reports"
      summary: Display a report
      description: Generates display data for a report.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Report ID
      responses:
        200:
          description: Successfully generated report display data
          content:
            application/json:
              schema:
                type: object
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/ReportNotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

  /reports/{id}/history:
    get:
      tags:
        - "Reports"
      summary: Get report edit history
      description: Returns the modification history for a specific report.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Report ID
      responses:
        200:
          description: Successfully retrieved report history
          content:
            application/json:
              schema:
                type: object
                properties:
                  modelHistory:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date-time
                        author:
                          type: object
                          properties:
                            _id:
                              type: string
                            email:
                              type: string
                        ops:
                          type: array
                          items:
                            type: object
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/ReportNotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Report:
      type: object
      properties:
        _id:
          type: string
          description: Unique identifier for the report
        name:
          type: string
          description: Name of the report
        clientId:
          type: string
          description: Client ID associated with the report
        payeeId:
          type: string
          nullable: true
          description: Payee ID associated with the report if created by a payee
        query:
          type: object
          description: Query parameters for the report
        createdBy:
          type: object
          properties:
            _id:
              type: string
            email:
              type: string
          description: User who created the report
        lastModifiedBy:
          type: object
          properties:
            _id:
              type: string
            email:
              type: string
          description: User who last modified the report
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the report was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the report was last updated

    ReportInput:
      type: object
      properties:
        name:
          type: string
          description: Name of the report
        query:
          type: object
          description: Query parameters for the report
      required:
        - name
        - query

  responses:
    Forbidden:
      description: Forbidden, the user does not have sufficient rights
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Forbidden"

    ReportNotFound:
      description: Report not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Could not find Report with ID {id}"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Internal error, please try again"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
