version: 0.2

env:
  secrets-manager:
    DOCKER_ACCOUNT_PASS: DOCKER_PASSWORD:CURVEROYALTYSYSTEMS
    NPM_TOKEN: NPM_TOKEN:CURVEPRODUCTION
    MASTER_ENCRYPTION_KEY: ENCRYPTION_KEYS:DUMMY
    jsonSecretToken: jsonSecretToken

phases:
  install:
    # Tut tut AWS : https://github.com/aws/aws-codebuild-docker-images/issues/490
    runtime-versions:
      nodejs: 22
    commands:
      - n 16
  pre_build:
    commands:
      - echo Updating psigning key
      - curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | apt-key add -
      - echo Updating package database
      - apt-get update
      - echo Installing additional packages
      - apt-get -y install dpkg-sig lintian fakeroot
      - sudo apt-get -y install ca-certificates curl
      - sudo install -m 0755 -d /etc/apt/keyrings
      - sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      - sudo chmod a+r /etc/apt/keyrings/docker.asc
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
      - sudo apt-get update
      - sudo apt-get -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      - echo dckr_pat_8xGjFb1FUwq1pXvFr_nZLlboGfU >> docker.txt
      - cat docker.txt | docker login --username arjundoelcurve --password-stdin
      - sudo docker pull mongo:latest
      - sudo docker run -d -p 27017:27017 --name mongodb mongo:latest
      - echo Waiting for mongodb to come up
      - sleep 5
      - aws --version
      # - echo Copying env file from S3 to source code ...
      # - aws s3 cp s3://curve-royalty-configuration-files/api/api-stellify.env ./.env --region eu-west-1
      - npm config set '//registry.npmjs.org/:_authToken' "$NPM_TOKEN"
      - echo Installing package.json..
      - npm install
      - echo Installing Mocha...
      - npm install -g mocha@10.0.0
  build:
    commands:
      - echo Build started on `date`
      - echo Starting tests
      - mocha --version
      - npm run test
  post_build:
    commands:
      - bash -c "if [ /"$CODEBUILD_BUILD_SUCCEEDING/" == /"0/" ]; then exit 1; fi"
      - echo Build stage successfully completed on `date`