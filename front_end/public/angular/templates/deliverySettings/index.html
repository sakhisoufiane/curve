<!-- OVERVIEW TAB-->
<script type="text/ng-template" id="overview-tab.html">
  <div id="CUR-jwdUNVZU" class="sm-p-l-15 sm-p-r-15 text-right">
    <button id="CUR-vMNgWhNh" type="button" class="btn btn-complete w-xs-100-p m-xs-l-0" ng-click="saveDeliverySettings()"><i
        class="fa fa-check"></i>
      Save</button>
  </div>
  <div id="CUR-FeMfHomD" class="row">
    <div id="CUR-zLPoDGxA" class="col-xs-12 col-sm-6">
      <div id="CUR-JTtWvQTw" class="panel panel-default" ng-if="clientType == 'Publisher'">
        <div id="CUR-PnnJLrZB" class="panel-heading">
          <div id="CUR-QDIvslKy" class="panel-title">
            CWR Setup
          </div>
          <div id="CUR-MGdQlgoe" class="form-group required">
            <label id="CUR-pzrwmCcj">Sending Party Name</label>
            <input id="CUR-XSgJqkTv" type="text" class="form-control" ng-model="client.cwrPartyName"
              ng-disabled="rights.catalogue != 'Edit'">
          </div>
          <div id="CUR-EYdfSbnF" class="form-group required">
            <label id="CUR-xIgpVElf">Sending Party ID</label>
            <input id="CUR-bYrAOGWN" type="text" class="form-control" ng-model="client.cwrPartyId" ng-disabled="rights.catalogue != 'Edit'">
          </div>
          <div id="CUR-wTFgDdBB" class="form-group required">
            <label id="CUR-ULVJhWdK">Sending IPI No</label>
            <input id="CUR-VZJnyCmw" type="text" class="form-control" ng-model="client.ipiNo" ng-disabled="rights.catalogue != 'Edit'">
          </div>
        </div>
      </div>
      </div>
        <div id="CUR-div-panel-default-AutoApprove" class="col-xs-12 col-sm-6" ng-if="clientType == 'Publisher' && features && features.deliveries">
          <div id="CUR-NrkoHiBb" class="panel panel-default">
          <div id="CUR-div-panel-heading-AutoApprove" class="panel-heading">
            <div id="CUR-div-panel-title-AutoApprove" class="panel-title">
              Auto Approve Works
            </div>
            <p>
              IMPORTANT - Enabling Auto Approve works will automatically queue works that are ingested into Curve and are valid for delivery.
              Unless you set Works to On Hold they will be delivered in any Delivery Schedules you have set up that include all Approved Works.
            </p>
            <div id="CUR-div-panel-body-fg-AutoApprove" class="form-group required">
              <input id="CUR-div-panel-body-fg-input-AutoApprove" type="checkbox" value="1" ng-model="client.autoApproveWorks">
              <label id="CUR-div-panel-body-fg-lbl-AutoApprove">Auto Approve Works</label>
            </div>
          </div>
        </div>
      </div>
      <div id="CUR-div-panel-default-AutoApprove" class="col-xs-12 col-sm-6" ng-if="clientType == 'Publisher' && features && features.deliveries">
        <div id="CUR-wZVOgiXN" class="panel panel-default">
          <div id="CUR-div-panel-heading-AutoApprove" class="panel-heading">
            <div id="CUR-div-panel-title-AutoApprove" class="panel-title">
              Delivery Schedule Settings
            </div>
          </div>
          <!-- Email -->
          <div id="CUR-ksdNlXmF" class="panel-body" style="color: #333;">
          <div id="CUR-div-panel-body-fg-email" class="form-group required">
            <label id="CUR-div-panel-body-fg-lbl-email">User Notifications</label>
          </div>
            <p>
            Add up to 3 users below to receive a notification 48 hours before a scheduled delivery is due to run, and confirmation when the delivery is complete.
            </p>
            <div id="CUR-div-panel-body-fg-email-form-group" class="form-group">
              <div id="CUR-div-panel-body-fg-email-form-input-container" class="row">
                  <user-select-field ng-repeat="email in deliveryEmails" value="email._id" edit="rights.catalogue == 'Edit'" populated="email.email" delete="removeDeliveryEmail(email)"></user-select-field>                    
                </div>
              </div>
            <button
              id="CUR-div-panel-body-fg-email-form-delete-add-btn"
              class="btn btn-complete"
              style="margin-left: 0px"
              ng-show="rights.catalogue == 'Edit'"
              ng-click="addDeliveryEmail(deliveryEmails, email)"
              ng-disabled="deliveryEmails.length >= 3"
            ><i class="fa fa-plus"></i> User</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</script>
