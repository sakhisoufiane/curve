<div id="CUR-ZLgTJgds" class="jumbotron" data-pages="parallax">
  <div id="CUR-UkKnZhEi" class="container-fluid container-fixed-lg sm-p-l-20 sm-p-r-20">
    <div id="CUR-iSdblkts" class="inner">
      <ul id="CUR-CvxXBZdG" class="breadcrumb">
        <li id="CUR-CzYBTEpX"><a id="CUR-NqoicqxZ" href="/#/mcps">MCPS</a></li>
        <li id="CUR-KPeiGXZe" ng-show="!negative._id"><a id="CUR-IhipwiQN" href="" class="active">Create</a></li>
        <li id="CUR-KLIQkXKt" ng-show="negative._id"><a id="CUR-aAJQwDff" href="/#/mcpsNegatives/{{negative._id}}/edit" class="active">{{negative.name}}</a></li>
      </ul>
    </div>
  </div>
</div>
<!-- Main Container -->
<div id="CUR-FgAdnzWd" class="container-fluid container-fixed-lg sm-p-l-5 sm-p-r-5">
  <div id="CUR-DOOfGZBd" class="row">
    <div id="CUR-rtjiacSV" class="col-xs-12 text-right two-cols-row">
      <button id="CUR-opyZVQGf" ng-show="rights.contracts == 'Edit'" class="btn btn-danger" data-toggle="modal" data-target="#deleteModal"><i class="fa fa-trash"></i>&nbsp;Delete</button>
      <button id="CUR-ZVDTdMlw" ng-show="rights.contracts == 'Edit'" class="btn btn-complete pull-right" ng-click="save()"><i class="fa fa-check"></i>&nbsp;Save</button>
    </div>
  </div>
  <div id="CUR-JDtGSvsB" class="row">
    <div id="CUR-iEByJRLd" class="col-xs-12 col-sm-6">
      <div id="CUR-QlnnGNID" class="panel panel-default">
        <div id="CUR-eDYUjZAf" class="panel-heading">
          <div id="CUR-ppASEAXb" class="panel-title">
            Overview
          </div>
        </div>
        <div id="CUR-IddntWSR" class="panel-body p-t-15">
          <div id="CUR-ZKAOqMNb" class="form-group">
            <label id="CUR-wMzdbnuD">Release</label>
            <release-select-field edit="rights.periods == 'Edit'" value="negative.releaseId"></release-select-field>
          </div>
          <div id="CUR-XPRqCyek" class="form-group">
            <label id="CUR-xaloTmBq">Year</label>
            <ui-select ng-model="negative.year">
              <ui-select-match allow-clear="true">
                <span id="CUR-YpTJVmJV" ng-bind="$select.selected"></span>
              </ui-select-match>
              <ui-select-choices repeat="item in (years | filter: $select.search)">
                <span id="CUR-ZyPspAAo" ng-bind="item"></span>
              </ui-select-choices>
            </ui-select>
          </div>
          <div id="CUR-cuIGGYfT" class="form-group">
            <label id="CUR-FxtSVyfA">Accounting Period</label>
            <ui-select ng-model="negative.accountingPeriod">
              <ui-select-match allow-clear="true">
                <span id="CUR-AaCvwboO" ng-bind="$select.selected"></span>
              </ui-select-match>
              <ui-select-choices repeat="item in (accountingPeriods | filter: $select.search)">
                <span id="CUR-Wxeqczzy" ng-bind="item"></span>
              </ui-select-choices>
            </ui-select>
          </div>
          <div id="CUR-rYLJkoEV" class="form-group">
            <label id="CUR-nIqWjPvW">Territory</label>
            <ui-select ng-model="negative.territory">
              <ui-select-match>
                  <span id="CUR-CaEIxowJ" ng-bind="$select.selected.name"></span>
              </ui-select-match>
              <ui-select-choices group-by="groupFind" repeat="country.code as country in countries | filter: $select.search">
                  <span id="CUR-TnJxeXdS" class="country" ng-bind="country.name"></span>
              </ui-select-choices>
            </ui-select>
          </div>
          <div id="CUR-KeAkEMJN" class="form-group required">
            <label id="CUR-XBomZGbF">Value</label>
            <input id="CUR-sQNYqhRa" type="number" class="form-control" ng-model="negative.value" ng-disabled="rights.periods != 'Edit'">
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="CUR-NaeRbzxn" class="row">
    <div id="CUR-PpcvMoMh" class="col-xs-12 text-center model-history-link">
      <span id="CUR-hznplYkz" ng-show="negative.updatedAt">Last Updated on {{ negative.updatedAt | date : dateFormat : 'UTC' }}.</span> <a id="CUR-fVeGBXyh" href="javascript:;" ng-click="modelHistory()" ng-show="rights.contracts == 'Edit'">See Full History</a>
    </div>
  </div>
</div>

<div class="modal fade stick-up" id="deleteModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div id="CUR-hdpECArd" class="modal-dialog">
    <div id="CUR-nxbqtGct" class="modal-content">
      <div id="CUR-mvLyUXln" class="modal-header clearfix text-left">
        <button id="CUR-peAlxocp" type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="pg-close fs-14"></i>
        </button>
        <h5 id="CUR-KVErufwQ">Delete Negative</h5>
      </div>
      <div id="CUR-SViAGBSj" class="modal-body">
        <div id="CUR-wfvSXLNc" class="row">
          <div id="CUR-ulYHTfSO" class="col-xs-12 m-t-20">
            <p>Are you sure you want to delete this negative? This cannot be undone.</p>
          </div>
        </div>
        <div id="CUR-eXiwqGST" class="row">
          <div id="CUR-xOZdPmGo" class="col-xs-12 m-t-20 text-right">
            <button id="CUR-YSXbtlYW" type="button" class="btn btn-default m-t-5" data-dismiss="modal">Cancel</button>
            <button id="CUR-JbjZPiEh" type="button" class="btn btn-danger m-t-5" ng-click="delete()"><i class="fa fa-trash"></i>&nbsp;Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<model-history data="negative.modelHistory"></model-history>
