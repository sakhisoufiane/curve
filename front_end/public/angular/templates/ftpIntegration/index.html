<script type="text/ng-template" id="sales-ftp-tab.html">
  <div id="CUR-fhVjKoBv" ng-if="userRole === 'client'">
      <div id="CUR-CVbWWoWL" class="row">
          <div id="CUR-lWxsqlkz" class="col-xs-12">
              <div id="CUR-iZDOAnVP" class="panel panel-default">
                  <div id="CUR-ecRoZEmm" class="panel-heading" style="display: flex; justify-content: space-between;">
                      <div id="CUR-GNqZnvOs" class="panel-title">Sales Ingestion FTP Details</div>
                      <button id="sales-ftp-tab-save-button" class="btn btn-complete" ng-click="saveSettings()"><i class="fa fa-check"></i> Save</button>
                  </div>
                  <div id="CUR-QYyvQFaH" class="panel-body">
                      <p>Once initialised, FTP servers marked as 'Active' will be scanned frequently for new sales data files. New files found will be
                      automatically ingested to Curve, and will be available as new sales files within the Sales Files area.</p>
                      <ftp-sales-ingest-row
                        ng-repeat="server in client.salesFtpIngestions track by $index"
                        server="server"
                        index="$index"
                        client-admin-user="clientAdminUser"
                        verify-ftp="verifyFtp(server)"
                        delete="deleteFtpIngestRow(server, 'salesFtpIngestions')"
                      >
                      </ftp-sales-ingest-row>
                      <br>
                      <button id="CUR-KvAQMFeX" class="btn btn-complete w-xs-100-p m-l-0" ng-click="addFtpIngestRow('salesFtpIngestions')">+ FTP server</button>
                  </div>
              </div>
          </div>
      </div>
    </div>
    <!-- user is logged in as a client -->
</script>
<script type="text/ng-template" id="ack-ftp-tab.html">
  <div id="CUR-ftpintegration-div-ack-template" ng-if="userRole === 'client'">

              <div id="CUR-ftpintegration-div-row-col-panel-ack-template" class="panel panel-default">
                  <div id="CUR-ftpintegration-div-row-col-panel-heading-ack-template" class="panel-heading" style="display: flex; justify-content: space-between;">

                  </div>
                  <div id="CUR-ftpintegration-div-row-col-panel-body-ack-template" class="panel-body">

                        index="$index"

<script type="text/ng-template" id="catalogue-ftp-tab.html">

                  <ui-select-match allow-clear="false">

              </div>
              <div id="CUR-sQIErdwe" class="form-group m-t-15">

              </div>
              <div id="CUR-sQIErXrX" class="form-group m-t-15">
                <input id="CUR-anCnKiff" type="checkbox" value="1" ng-model="client.matchContractOnImport">
                <label id="CUR-kCidaEmn">Match Contracts on Import</label>
              </div>
              <div id="CUR-xCfiEZNw" class="form-group">

                <label id="CUR-lmlARceJ">Set Default Release ID on Import</label>
              </div>
              <div id="CUR-bmlVNqOf" class="form-group">
                <input id="CUR-ccNyyzOQ" type="checkbox" value="1" ng-model="client.ingestForeignIds">
                <label id="CUR-EDecPiWM">Ingest Foreign IDs from Delivery</label>
              </div>
              <div id="CUR-LIfPXMWs" class="form-group">

                <label id="CUR-lZIAunKb">Set Cat No From Barcode on Import</label>
              </div>
            </div>
          </div>
          <button
            id="CUR-div-panel-body-verify-connection-btn"
            class="btn btn-confirm"

            ng-click="verifyFtpClient(client)"

      </div>
    </div>
  </div>

                  <input id="fugaMatchContractsOnImport" type="checkbox" ng-model="fuga.matchContractsOnImport">
                  <label id="CUR-rbAHxeQt" for="fugaMatchContractsOnImport">Match Contracts on Import</label>
                </div>
                <div id="CUR-tBDfbiqB" class="form-group">
                  <input id="fugaSetDefaultReleaseIdOnImport" type="checkbox" ng-model="fuga.setDefaultReleaseIdOnImport">
                  <label id="CUR-xgBFbhWE" for="fugaSetDefaultReleaseIdOnImport">Set Default Release ID on Import</label>
                </div>
                <div id="CUR-UkuWAjFl" class="form-group">
                  <input id="fugaIngestForeignIdsFromDelivery" type="checkbox" ng-model="fuga.ingestForeignIdsFromDelivery">
                  <label id="CUR-aKaoCNvf" for="fugaIngestForeignIdsFromDelivery">Ingest Foreign IDs from Delivery</label>
                </div>
                <div id="CUR-AWLpAqLd" class="form-group">
                  <input id="fugaSetCatNoFromBarcodeOnImport" type="checkbox" ng-model="fuga.setCatNoFromBarcodeOnImport">
                  <label id="CUR-OofcmXYK" for="fugaSetCatNoFromBarcodeOnImport">Set Cat No From Barcode on Import</label>
                </div>
              </form>
            </div>
            <div id="CUR-fgwUkQnC" class="col-sm-6 m-t-25 m-b-50">
              <div id="CUR-div-panel-body-fg-email" class="form-group required" style="border: 1px solid rgba(0,0,0,.07); padding: 10px;">
                <label id="CUR-div-panel-body-fg-lbl-email">User Notifications</label>
                <p ng-if="!internalUser && !features.showFugaSyncExtras">Add up to 3 users below to receive a notification when syncs are complete.</p>
                <p ng-if="internalUser || features.showFugaSyncExtras">Add up to 10 users below to receive a notification when syncs are complete.</p>
                <div id="CUR-HEgriReu"  ng-repeat="email in fuga.fugaNotifyEmails" class="row">
                  <div class="col-xs-6">
                    <input type="text" class="form-control" ng-model="email.email">
                  </div>
                  <div class="col-xs-6">
                    <button id="CUR-oYdQXHLs" class="btn btn-danger sm-p-l-0 sm-p-r-0 m-l-0" ng-click="removeFugaNotificationEmail(email.id)">
                      <i class="fa fa-trash"></i>
                    </button>
                  </div>
                </div>
                <button
                  id="CUR-div-panel-body-fg-email-form-delete-add-btn"
                  class="btn btn-complete"
                  style="margin-left: 0px"
                  ng-show="rights.catalogue == 'Edit'"
                  ng-click="addFugaNotificationEmail()"
                  ng-disabled="fuga.fugaNotifyEmails.length >= 3"
                  ng-if="!internalUser && !features.showFugaSyncExtras"
                ><i class="fa fa-plus"></i> User</button>
                <button
                  id="CUR-div-panel-body-fg-email-form-delete-add-btn"
                  class="btn btn-complete"
                  style="margin-left: 0px"
                  ng-show="rights.catalogue == 'Edit'"
                  ng-click="addFugaNotificationEmail()"
                  ng-disabled="fuga.fugaNotifyEmails.length >= 10"
                  ng-if="internalUser || features.showFugaSyncExtras"
                ><i class="fa fa-plus"></i> User</button>
              </div>
              <div id="CUR-div-panel-body-fg-notifications" class="form-group required" style="border: 1px solid rgba(0,0,0,.07); padding: 10px;" ng-if="internalUser || features.showFugaSyncExtras">
                <label id="CUR-div-panel-body-fg-lbl-notifications">Statement Notifications</label>
                <p>Add email addresses below, separated by commas to receive a notification when their Statements are complete.</p>
                <div id="CUR-div-form-group-notifications" class="form-group">
                  <input id="CUR-form-input-notifications" type="text" class="form-control" ng-model="fuga.statementNotifications">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</script>
<script type="text/ng-template" id="iswc-ftp-tab.html">
  <div id="CUR-ftpintegration-div-iswc-template" ng-if="userRole === 'client'">
      <div id="CUR-ftpintegration-div-row-iswc-template" class="row">
          <div id="CUR-ftpintegration-div-row-col-iswc-template" class="col-xs-12">
              <div id="CUR-ftpintegration-div-row-col-panel-iswc-template" class="panel panel-default">
                  <div id="CUR-ftpintegration-div-row-col-panel-heading-iswc-template" class="panel-heading" style="display: flex; justify-content: space-between;">
                      <div id="CUR-ftpintegration-div-row-col-panel-heading-title-iswc-template" class="panel-title">Acknowledgement Ingestion FTP Details</div>
                      <button id="iswc-ftp-tab-save-button" class="btn btn-complete" ng-click="saveSettings()"><i class="fa fa-check"></i> Save</button>
                  </div>
                  <div id="CUR-ftpintegration-div-row-col-panel-body-iswc-template" class="panel-body">
                      <ftp-iswc-ingest-row
                        ng-repeat="server in client.iswcFtpIngestions track by $index"
                        server="server"
                        verify-ftp="verifyFtp(server)"
                        index="$index"
                        client-admin-user="clientAdminUser"
                        delete="deleteFtpIngestRow(server, 'iswcFtpIngestions')">
                      </ftp-iswc-ingest-row>
                      <br>
                      <button id="CUR-ftpintegration-div-row-col-panel-body-button-ack-template" class="btn btn-complete w-xs-100-p m-l-0" ng-click="addFtpIngestRow('iswcFtpIngestions')">+ FTP server</button>
                  </div>
              </div>
          </div>
       </div>
    </div>
  </div>
</script>
