    <div id="CUR-nRUFyjAC" class="col-sm-12 col-md-6 col-md-offset-1 col-lg-6 col-md-offset-0 text-right">

                <th ng-click="getSortedData('status', orderDir)" ng-class="whatClassIsIt('type')">Status</th>

              <tr id="CUR-zkdFzbOQ" payment-group-table-row ng-repeat="group in paymentGroups" group="group" edit="rights.periods == 'Edit'"></tr>

  </div>
</div>

</div>
