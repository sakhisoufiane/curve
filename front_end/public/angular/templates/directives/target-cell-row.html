<div class="row" ng-if="index == 0">
  <div class="form-group col-xs-4">
    <label>Field</label>
  </div>
  <div class="form-group col-xs-4">
    <label>Type</label>
  </div>
  <div class="form-group col-xs-4">
    <label>Cell</label>
  </div>
</div>
<div class="row">
  <div class="form-group col-xs-4">
    <ui-select ng-model="targetCell.field" ng-disabled="edit != true">
      <ui-select-match allow-clear="true">
        <span ng-bind="$select.selected.name"></span>
      </ui-select-match>
      <ui-select-choices repeat="field.value as field in targetCellFields | filter: $select.search">
        <span ng-bind="field.name"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group col-xs-4">
    <select class="form-control" ng-model="targetCell.type" ng-options="type.value as type.name for type in targetCellTypes" ng-disabled="edit != true"></select>
  </div>
  <div class="form-group col-xs-2">
    <input type="text" class="form-control" ng-model="targetCell.cell" ng-disabled="edit != true">
  </div>
  <div class="form-group col-xs-2">
    <button class="btn btn-danger" ng-show="edit == true" ng-click="delete({ targetCell: targetCell })"><i class="fa fa-trash"></i></button>
  </div> 
</div>
