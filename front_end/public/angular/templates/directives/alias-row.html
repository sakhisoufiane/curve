<div class="row">
  <div class="form-group col-xs-8 col-sm-10">
    <input type="text" class="form-control" ng-model="alias.name" ng-disabled="edit != true" placeholder="Enter alias name">
  </div>
  <div class="form-group col-xs-4 col-sm-2">
    <button class="btn btn-danger" ng-show="edit == true"ng-click="delete({ alias: alias })"><i class="fa fa-trash"></i></button>
  </div> 
</div>
