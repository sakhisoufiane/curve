<div class="row" ng-if="index == 0">
  <div class="form-group col-xs-5">
    <label>Release</label>
  </div>
  <div class="form-group col-xs-5">
    <label>Foreign ID</label>
  </div>
</div>
<div class="row">
  <div class="form-group col-xs-5">
    <release-select-field value="item.releaseId" edit="edit"></release-select-field>
  </div>
  <div class="form-group col-xs-5">
    <input type="text" class="form-control" ng-model="item.value" ng-if="edit">
    <read-only-field ng-if="!edit" parent-field="item" field="'value'"></read-only-field>
  </div>
  <div class="form-group col-xs-2">
    <button class="btn btn-danger" ng-show="edit == true" ng-click="delete({ item: item })"><i class="fa fa-trash"></i></button>
  </div>
</div>
