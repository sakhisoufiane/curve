<div class="row" ng-if="index == 0">
	<div class="form-group currency-field">
		<label>From</label>
	</div>
	<div class="form-group currency-field">
		<label>To</label>
	</div>
	<div class="form-group currency-field">
		<label>Rate</label>
	</div>
</div>
<div ng-show="exchangeRate.show || sales" class="row">
  <div class="form-group currency-field">
    <ui-select class="full-width" ng-model="exchangeRate.from" on-select="onSelectedTemplate($item)">
      <ui-select-match allow-clear="true">
        <span ng-bind="$select.selected"></span> 
      </ui-select-match>
      <ui-select-choices repeat="currency in currencies | filter: $select.search track by $index">
        <span ng-bind="currency"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group currency-field">
    <ui-select class="full-width" ng-model="exchangeRate.to" on-select="onSelectedTemplate($item)">
      <ui-select-match allow-clear="true">
        <span ng-bind="$select.selected"></span> 
      </ui-select-match>
      <ui-select-choices repeat="currency in toCurrencies | filter: $select.search track by $index">
        <span ng-bind="currency"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group currency-field">
    <input type="number" class="form-control" ng-model="exchangeRate.rate">
  </div>
  <div ng-show="internal || exchangeRate.allowDeletion || sales" class="form-group currency-delete">
    <button class="btn btn-danger" ng-click="delete({ exchangeRate: exchangeRate })"><i class="fa fa-trash"></i></button>
  </div> 
</div>
