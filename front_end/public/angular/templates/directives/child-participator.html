<div class="row contract-row-layout">
  <div class="form-group required col-xs-1">
    <div ng-class="index > 0 ? 'elbow subsequent' : 'elbow'">
    </div>
  </div>
  <div class="form-group col-xs-4">
    <label ng-if="!index">Contract</label>
    <contract-select-field value="contract.contractId" populated="contract.contract" edit="edit"></contract-select-field>
  </div>
  <div class="form-group col-xs-3">
    <label ng-if="!index">Rate</label>
    <input type="number" class="form-control sm-p-l-5 sm-p-r-5" ng-model="contract.percentage" ng-if="edit">
    <read-only-field ng-if="!edit" parent-field="contract" field="'percentage'"></read-only-field>
  </div>
  <div class="form-group col-xs-4 action-btn">
    <button ng-show="edit == true" ng-class="index ? 'btn btn-danger sm-p-l-0 sm-p-r-0 m-l-0' : 'btn btn-danger row-button sm-p-l-0 sm-p-r-0 m-l-0'" ng-click="deleteChild(parent, contract)"><i class="fa fa-trash"></i></button>
    <button ng-show="edit == true" ng-class="index ? 'btn btn-primary sm-p-l-0 sm-p-r-0 m-l-0' : 'btn btn-primary row-button sm-p-l-0 sm-p-r-0 m-l-0'" ng-click="addChild(contract)">+ Sub Contract</button>
  </div> 
  <child-participator class="col-xs-12" ng-repeat="child in contract.children" contract="child" contracts="contracts" parent="contract" index="$index"></child-participator>
</div>
