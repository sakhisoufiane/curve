<div class="row">
  <div class="form-group col-xs-5">
    <select class="form-control" ng-model="configuration.name" ng-options="item as item for item in configurations" ng-disabled="edit != true"></select>
  </div>
  <div class="form-group col-xs-4">
    <input type="text" class="form-control" ng-model="configuration.map" ng-disabled="edit != true">
  </div> 
  <div class="form-group col-xs-3">
    <button class="btn btn-danger" ng-show="edit == true" ng-show="edit == true" ng-click="delete({ configuration: configuration })"><i class="fa fa-trash"></i></button>
  </div> 
</div>
