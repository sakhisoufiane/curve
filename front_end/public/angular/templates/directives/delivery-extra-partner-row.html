<div class="row m-r-0 m-l-0 ">
  <div class="panel panel-default bg-gray-l">
    <div class="panel-body p-t-15">
      <div class="row m-r-0 m-l-0 ">
        <div class="form-group col-xs-4 p-l-0">
          <label>Publisher</label>
          <publisher-select-field edit="edit" value="extraPartner.publisherId"></publisher-select-field>
        </div>
        <div class="form-group col-xs-3">
          <label>Mechanical PRO</label>
          <ui-select ng-model="extraPartner.mechanicalPro">
            <ui-select-match allow-clear="true">
              <span ng-bind="$select.selected"></span>
            </ui-select-match>
            <ui-select-choices repeat="item in pros | filter: $select.search track by $index">
              <span ng-bind="item"></span>
            </ui-select-choices>
          </ui-select>
        </div>
        <div class="form-group col-xs-3">
          <label>Performance PRO</label>
          <ui-select ng-model="extraPartner.performancePro">
            <ui-select-match allow-clear="true">
              <span ng-bind="$select.selected"></span>
            </ui-select-match>
            <ui-select-choices repeat="item in pros | filter: $select.search track by $index">
              <span ng-bind="item"></span>
            </ui-select-choices>
          </ui-select>
        </div>
        <div class="form-group col-xs-2 text-right p-t-5 p-r-0">
          <button class="btn btn-danger" ng-click="delete(extraPartner)"><i class="fa fa-trash"></i></button>
        </div>
      </div>
      <div class="row m-r-0 m-l-0">
        <div class="form-group col-xs-12 p-l-0 p-r-0 m-b-0">
          <label ng-click="toggleTerritories()">Territories <i class="glyphicon" ng-class="{'glyphicon-chevron-down': showTerritories, 'glyphicon-chevron-right': !showTerritories}"></i></label>
          <div uib-collapse="!showTerritories">
            <div class="panel panel-default">
              <div class="panel-body p-t-15">
                <territory-checkboxes model="extraPartner.territories" edit="true" hide-non-cisac="true"></territory-checkboxes>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
