<div class="row">
  <div class="form-group col-xs-5">
    <select class="form-control" ng-model="category.name" ng-options="item as item for item in categories" ng-disabled="edit != true"></select>
  </div>
  <div class="form-group col-xs-4">
    <input type="text" class="form-control" ng-model="category.map" ng-disabled="edit != true">
  </div> 
  <div class="form-group col-xs-3">
    <button class="btn btn-danger" ng-show="edit == true" ng-click="delete({ category: category })"><i class="fa fa-trash"></i></button>
  </div> 
</div>
