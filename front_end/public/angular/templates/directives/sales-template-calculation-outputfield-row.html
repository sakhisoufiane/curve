<div class="row">
  <div class="form-group col-sm-3">
    <ui-select ng-model="outputfield.function" ng-disabled="edit != true">
      <ui-select-match>
        <span ng-bind="$select.selected.name"></span>
      </ui-select-match>
      <ui-select-choices repeat="item.value as item in functionTypes | filter: $select.search">
        <span class="country" ng-bind="item.name"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group col-sm-1">
  </div>
  <div class="form-group col-sm-3">
    <ui-select ng-model="outputfield.valueType" ng-disabled="edit != true" ng-if="outputfield.function != 'Round' && outputfield.function != 'RoundUp' && outputfield.function != 'RoundDown'">
      <ui-select-match>
        <span ng-bind="$select.selected"></span>
      </ui-select-match>
      <ui-select-choices group-by="groupFind" repeat="item in valueTypes | filter: $select.search">
        <span class="country" ng-bind="item"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group col-sm-3">
    <input type="number" class="form-control" ng-model="outputfield.value" ng-if="outputfield.valueType === 'Column' && outputfield.function != 'Round' && outputfield.function != 'RoundUp' && outputfield.function != 'RoundDown'" ng-disabled="edit != true">
    <input type="text" class="form-control" ng-model="outputfield.value" ng-disabled="edit != true" ng-if="outputfield.valueType === 'Value' && outputfield.function != 'Round' && outputfield.function != 'RoundUp' && outputfield.function != 'RoundDown'">
    <ui-select ng-model="outputfield.value" ng-disabled="edit != true" ng-if="outputfield.valueType === 'Field' && outputfield.function != 'Round' && outputfield.function != 'RoundUp' && outputfield.function != 'RoundDown'">
      <ui-select-match>
        <span ng-bind="$select.selected.name"></span>
      </ui-select-match>
      <ui-select-choices repeat="item.value as item in templateFields | filter: $select.search">
        <span class="country" ng-bind="item.name"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group col-sm-2">
    <div class="form-group">
      <button class="btn btn-danger" ng-show="edit == true" ng-click="delete({ outputfield: outputfield })"><i class="fa fa-trash"></i></button>
    </div>
  </div>
</div>
