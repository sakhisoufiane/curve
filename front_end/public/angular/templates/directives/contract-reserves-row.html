<div class="row">
	<div class="form-group col-xs-8 col-sm-10">
		<label>Period {{index + 1}}</label>
    <input type="text" class="form-control" ng-model="reserve.rate" ng-disabled="edit != true">
  </div>
  <div class="form-group col-xs-4 col-sm-2 text-right">
    <button class="btn btn-danger row-button" ng-show="edit == true" ng-click="delete({ reserve: reserve })"><i class="fa fa-trash"></i></button>
  </div> 
</div>
