<div class="row">
	<div class="form-group col-xs-5">
		<label>Configuration</label>
    <select class="form-control" ng-model="escalationEquivalent.configuration" ng-options="item.value as item.name for item in localConfigurations" ng-disabled="edit != true"></select>
  </div>
  <div class="form-group col-xs-5">
		<label>Amount</label>
    <input type="number" class="form-control" ng-model="escalationEquivalent.amount" ng-disabled="edit != true">
  </div>
  <div class="form-group col-xs-2 text-right">
    <button class="btn btn-danger row-button" ng-show="edit == true" ng-click="delete({ escalationEquivalent: escalationEquivalent })"><i class="fa fa-trash"></i></button>
  </div>
</div>
