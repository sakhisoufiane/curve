<div data-ng-if="comparisonData || alwaysShow" data-ng-class="{ 'col-xs-12' : !comparisonData, 'col-xs-6': comparisonData }">
  <div class="row" data-ng-if="data && data.length > 0">
    <div class="col-xs-12">
      <div class="panel panel-default sm-m-b-5">
        <div class="panel-heading">
          <div class="panel-title">
            {{heading}}
          </div>
        </div>
        <div class="panel-body sm-p-l-5 sm-p-r-5 sm-p-b-30">
          <div class="col-xs-12 max-height-400">
            <div class="table-responsive">
              <table class="table table-hover table-condensed no-footer">
                <thead>
                  <tr>
                    <th>Source</th>
                    <th>Sub Source</th>
                    <th class="text-right">Average Rate</th>
                  </tr>
                </thead>
                <tbody>
                  <tr data-ng-repeat="line in data">
                    <td>{{line.source}}</td>
                    <td>{{line.subSource}}</td>
                    <td class="text-right">{{line.averageStreamRate | number: 6}}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
