<div class="row">
  <div class="form-group col-xs-5">
    <input type="text" class="form-control" ng-model="subSource.name" ng-disabled="edit != true">
  </div>
  <div class="form-group col-xs-4">
    <input type="text" class="form-control" ng-model="subSource.map" ng-disabled="edit != true">
  </div> 
  <div class="form-group col-xs-3">
    <button class="btn btn-danger" ng-show="edit == true" ng-click="delete({ subSource: subSource })"><i class="fa fa-trash"></i></button>
  </div> 
</div>
