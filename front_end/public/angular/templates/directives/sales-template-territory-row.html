<div class="row">
  <div class="form-group col-xs-5">
    <ui-select ng-model="territory.name" ng-disabled="edit != true">
      <ui-select-match>
          <span ng-bind="$select.selected.name"></span>
      </ui-select-match>
      <ui-select-choices group-by="groupFind" repeat="item.code as item in territories | filter: $select.search">
          <span class="country" ng-bind="item.name"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group col-xs-4">
    <input type="text" class="form-control" ng-model="territory.map" ng-disabled="edit != true"> 
  </div> 
  <div class="form-group col-xs-3">
    <button class="btn btn-danger" ng-show="edit == true" ng-click="delete({ territory: territory })"><i class="fa fa-trash"></i></button>
  </div> 
</div>
