<div class="row">
  <div class="form-group col-xs-5">
    <ui-select ng-model="field.from" ng-disabled="edit != true">
      <ui-select-match>
        <span ng-bind="$select.selected.name"></span>
      </ui-select-match>
      <ui-select-choices repeat="field.value as field in fields | filter: $select.search">
        <span ng-bind="field.name"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group col-xs-5">
    <ui-select ng-model="field.to" ng-disabled="edit != true">
      <ui-select-match>
        <span ng-bind="$select.selected.name"></span>
      </ui-select-match>
      <ui-select-choices repeat="field.value as field in fields | filter: $select.search">
        <span ng-bind="field.name"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group col-xs-2">
    <button class="btn btn-danger" ng-show="edit == true" ng-click="delete({ field: field })"><i class="fa fa-trash"></i></button>
  </div> 
</div>
