<div class="row">
  <div class="form-group col-xs-8 col-sm-8">
    <input type="text" class="form-control" ng-model="group.name" ng-disabled="edit != true">
  </div>
  <div class="form-group col-xs-4 col-sm-4 text-right">
    <button class="btn btn-danger" ng-click="delete({ group: group })" ng-show="edit == true"><i class="fa fa-trash"></i></button>
  </div> 
</div>
