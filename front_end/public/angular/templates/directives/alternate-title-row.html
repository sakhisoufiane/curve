<div class="row">
  <div class="form-group col-xs-6">
    <input
      type="text"
      class="form-control"
      ng-model="title.title"
      ng-disabled="edit != true"
    />
  </div>
  <div class="form-group col-xs-4">
    <ui-select ng-disabled="edit != true" ng-model="title.language">
      <ui-select-match allow-clear="true">
        <span ng-bind="$select.selected"></span>
      </ui-select-match>
      <ui-select-choices repeat="item in languages | filter: $select.search">
        <span ng-bind="item"></span>
      </ui-select-choices>
    </ui-select>
  </div>
  <div class="form-group col-xs-2 text-right">
    <button
      class="btn btn-danger"
      ng-click="delete({ title: title })"
      ng-show="edit == true"
    >
      <i class="fa fa-trash"></i>
    </button>
  </div>
</div>
