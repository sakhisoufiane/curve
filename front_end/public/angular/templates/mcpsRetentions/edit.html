<div id="CUR-SzniQBeE" class="jumbotron" data-pages="parallax">
  <div id="CUR-yvoZkhBm" class="container-fluid container-fixed-lg sm-p-l-20 sm-p-r-20">
    <div id="CUR-kInTYRCx" class="inner">
      <ul id="CUR-ZFTblrQk" class="breadcrumb">
        <li id="CUR-PJPqDlLp"><a id="CUR-SmvbfFeJ" href="/#/mcps">MCPS</a></li>
        <li id="CUR-AIcdCwqH" ng-show="!retention._id"><a id="CUR-hbatRNtb" href="" class="active">Create</a></li>
        <li id="CUR-IyDEFWGy" ng-show="retention._id"><a id="CUR-PLdJWINj" href="/#/mcpsRetentions/{{retention._id}}/edit" class="active">{{retention.name}}</a></li>
      </ul>
    </div>
  </div>
</div>
<!-- Main Container -->
<div id="CUR-lbfEoqqf" class="container-fluid container-fixed-lg sm-p-l-5 sm-p-r-5">
  <div id="CUR-IiyaaGRy" class="row">
    <div id="CUR-uhAuSjBE" class="col-xs-12 text-right two-cols-row">
      <button id="CUR-wsefppKG" ng-show="rights.contracts == 'Edit'" class="btn btn-danger" data-toggle="modal" data-target="#deleteModal"><i class="fa fa-trash"></i>&nbsp;Delete</button>
      <button id="CUR-tMECxqTm" ng-show="rights.contracts == 'Edit'" class="btn btn-complete pull-right" ng-click="save()"><i class="fa fa-check"></i>&nbsp;Save</button>
    </div>
  </div>
  <div id="CUR-MkOdxOwj" class="row">
    <div id="CUR-WEakQjzb" class="col-xs-12 col-sm-6">
      <div id="CUR-kpNyrNMg" class="panel panel-default">
        <div id="CUR-gNHdaBkv" class="panel-heading">
          <div id="CUR-wYEmuynO" class="panel-title">
            Overview
          </div>
        </div>
        <div id="CUR-ABeCXAzC" class="panel-body p-t-15">
          <div id="CUR-TVnWhUIQ" class="form-group">
            <label id="CUR-LPgqrpMN">Release</label>
            <release-select-field edit="rights.periods == 'Edit'" value="retention.releaseId"></release-select-field>
          </div>
          <div id="CUR-FnLMNXtv" class="form-group">
            <label id="CUR-tBUmCIeL">Year</label>
            <ui-select ng-model="retention.year">
              <ui-select-match allow-clear="true">
                <span id="CUR-vZVBKiIi" ng-bind="$select.selected"></span>
              </ui-select-match>
              <ui-select-choices repeat="item in (years | filter: $select.search)">
                <span id="CUR-imYEgQMV" ng-bind="item"></span>
              </ui-select-choices>
            </ui-select>
          </div>
          <div id="CUR-OqwIiFSd" class="form-group">
            <label id="CUR-QSMOgHzt">Accounting Period</label>
            <ui-select ng-model="retention.accountingPeriod">
              <ui-select-match allow-clear="true">
                <span id="CUR-UcbYfdoJ" ng-bind="$select.selected"></span>
              </ui-select-match>
              <ui-select-choices repeat="item in (accountingPeriods | filter: $select.search)">
                <span id="CUR-DbfhhGCQ" ng-bind="item"></span>
              </ui-select-choices>
            </ui-select>
          </div>
          <div id="CUR-zPPbaxUL" class="form-group">
            <label id="CUR-yVqOGzmc">Territory</label>
            <ui-select ng-model="retention.territory">
              <ui-select-match>
                  <span id="CUR-XZPVfzwA" ng-bind="$select.selected.name"></span>
              </ui-select-match>
              <ui-select-choices group-by="groupFind" repeat="country.code as country in countries | filter: $select.search">
                  <span id="CUR-UUeVGTuR" class="country" ng-bind="country.name"></span>
              </ui-select-choices>
            </ui-select>
          </div>
          <div id="CUR-FrKHkZRS" class="form-group required">
            <label id="CUR-HxoeNWim">Retention</label>
            <input id="CUR-RnhRHlPM" type="number" class="form-control" ng-model="retention.retention" ng-disabled="rights.periods != 'Edit'">
          </div>
          <div id="CUR-hNtJgdlw" class="form-group required">
            <label id="CUR-sYmWjyzD">TV Retention</label>
            <input id="CUR-KNTrjLcv" type="number" class="form-control" ng-model="retention.tvRetention" ng-disabled="rights.periods != 'Edit'">
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="CUR-ZtYWuSEt" class="row">
    <div id="CUR-KPUjkHKu" class="col-xs-12 text-center model-history-link">
      <span id="CUR-jPufzrEj" ng-show="retention.updatedAt">Last Updated on {{ retention.updatedAt | date : dateFormat : 'UTC' }}.</span> <a id="CUR-VQVIJqjt" href="javascript:;" ng-click="modelHistory()" ng-show="rights.contracts == 'Edit'">See Full History</a>
    </div>
  </div>
</div>

<div class="modal fade stick-up" id="deleteModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div id="CUR-jicaJyWN" class="modal-dialog">
    <div id="CUR-lmGJppQC" class="modal-content">
      <div id="CUR-ZZaeUWjv" class="modal-header clearfix text-left">
        <button id="CUR-jKshAJia" type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="pg-close fs-14"></i>
        </button>
        <h5 id="CUR-vtAlOTuI">Delete Retention</h5>
      </div>
      <div id="CUR-ohTGCGHN" class="modal-body">
        <div id="CUR-IizLPvoo" class="row">
          <div id="CUR-XtsEEJjo" class="col-xs-12 m-t-20">
            <p>Are you sure you want to delete this retention? This cannot be undone.</p>
          </div>
        </div>
        <div id="CUR-JTfTiyDb" class="row">
          <div id="CUR-KHwHvxCt" class="col-xs-12 m-t-20 text-right">
            <button id="CUR-ELRaYGcx" type="button" class="btn btn-default m-t-5" data-dismiss="modal">Cancel</button>
            <button id="CUR-QOAEmYhg" type="button" class="btn btn-danger m-t-5" ng-click="delete()"><i class="fa fa-trash"></i>&nbsp;Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<model-history data="retention.modelHistory"></model-history>
