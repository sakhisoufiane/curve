            <span id="acknowledgement-filter-type-form-select" ng-bind="$select.selected"></span>
          </ui-select-match>
          <ui-select-choices repeat="item in (['ISWC Resolution (IRS)','ISWC Allocation (IAS)'] | filter: $select.search)">
            <span id="acknowledgement-filter-type-form-item" ng-bind="item"></span>
          </ui-select-choices>
        </ui-select>
      </div>
    </div>

        <label id="CUR-gNlOYxRx">Partner</label>
        <ui-select ng-model="iswcAcknowledgementsFilter.deliveryPartnerId" ng-disabled="rights.catalogue != 'Edit'">
          <ui-select-match allow-clear="true">
            <span id="CUR-hCTGOhQC" ng-bind="$select.selected.name"></span>
          </ui-select-match>
          <ui-select-choices repeat="item._id as item in deliveryPartners | filter: $select.search track by $index">

            <thead>
              <tr id="CUR-iswc-ack-table-thead-tr">
                <th class="table-checkbox">
                  <input id="CUR-iswc-ack-table-checkbox-all" type="checkbox" class="select-all" ng-click="selectAllIswcAcknowledgements()" ng-checked="selectAllIswcAckChecked" ng-show="rights.catalogue == 'Edit'">
                </th>
                <th>Name</th>
                <th>Type</th>
                <th>Partner</th>
                <th>Iswc In</th>
                <th>Iswc Missing</th>
                <th>Ingestion</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody id="CUR-iswc-ack-table-tbody">
              <tr id="CUR-iswc-ack-table-tbody-tr" ng-repeat="iswcAcknowledgement in iswcAcknowledgements">
                <td id="CUR-iswc-ack-table-tbody-checkbox" class="v-align-middle hidden-xs"><input type="checkbox" ng-model="iswcAcknowledgement.selected"></td>
                <td id="CUR-iswc-ack-table-tbody-filename"><a href="/#/iswcAcknowledgements/{{iswcAcknowledgement._id}}/edit">{{iswcAcknowledgement.fileName}}</a></td>
                <td id="CUR-iswc-ack-table-tbody-outputformat">{{iswcAcknowledgement.outputFormat}}</td>
                <td id="CUR-iswc-ack-table-tbody-deliverypartner"><a href="/#/deliverySettings/deliveryPartners/{{iswcAcknowledgement.deliveryPartnerId}}/edit">{{iswcAcknowledgement.deliveryPartnerName}}</a></td>
                <td id="CUR-iswc-ack-table-tbody-iswcin">
                  <div class="successCircle" ng-style="iswcAcknowledgement.iswcIn > 100 ? {'width': '25px', 'height': '25px'} : {}">{{iswcAcknowledgement.iswcIn}}</div>
                </td>
                <td id="CUR-iswc-ack-table-tbody-iswcmissing">
                  <div class="dangerCircle" ng-style="iswcAcknowledgement.iswcMissing > 100 ? {'width': '25px', 'height': '25px'} : {}">{{iswcAcknowledgement.iswcMissing}}</div>
                </td>
                <td id="CUR-iswc-ack-table-tbody-ingestion">
                  <span id="CUR-iswc-ack-table-tbody-ingestion-ingested" ng-if="!iswcAcknowledgement.errors.length" class="label label-sm label-green">Ingested</span>
                  <span id="CUR-iswc-ack-table-tbody-ingestion-errored" ng-if="iswcAcknowledgement.errors.length" class="label label-sm label-danger" tooltips tooltip-side="left" tooltip-template="Errored<br/><br/>{{iswcAcknowledgement.errors.join('<br/><br/>')}}">Errored</span>
                </td>
                <td id="CUR-iswc-ack-table-tbody-createdat">{{ iswcAcknowledgement.createdAt | date : 'MMM d, yyyy' : 'UTC' }}</td>
              </tr>
            </tbody>
