<div id="CUR-HQENeRUK" class="jumbotron" data-pages="parallax">
  <div id="CUR-vrotThMg" class="container-fluid container-fixed-lg sm-p-l-20 sm-p-r-20">
    <div id="CUR-IgQqpKix" class="inner">
      <ul id="CUR-ILHoKCDn" class="breadcrumb">
        <li id="CUR-mvYjCcfO"><a id="CUR-HHInRIbW" href="/#/imports">Imports</a></li>
        <li id="CUR-shbAszko" ng-show="!import._id"><a id="CUR-ZMIfiKAH" href="" class="active">Create</a></li>
        <li id="CUR-HobEapLb" ng-show="import._id"><a id="CUR-CpWBXJgm" href="/#/imports/{{import._id}}/edit" class="active">{{import.name}}</a></li>
        </li>
      </ul>
    </div>
  </div>
</div>
<!-- Main Container -->
<import-new ng-if="import.status == 'Setup' && (!import.setupStage || import.setupStage == 'Setup')"></import-new>
<import-files ng-if="import.status == 'Setup' && import.setupStage == 'Files'"></import-files>
<import-mapping ng-if="import.status == 'Setup' && import.setupStage == 'Mapping'"></import-mapping>
<import-defaults ng-if="import.status == 'Setup' && import.setupStage == 'Defaults'"></import-defaults>
<import-complete ng-if="import.status == 'Complete'"></import-complete>
<!-- Loading Page -->
<div id="CUR-kczwpSVv" class="container-fluid container-fixed-lg" ng-if="import.status == 'Importing'">
  <div id="CUR-BTzXwzPV" class="row">
    <div id="CUR-cunmuIwo" class="col-xs-12 col-sm-6 col-sm-offset-3">
      <div id="CUR-RGxxIeGx" class="panel panel-default text-center">
        <div id="CUR-wTaVaifq" class="panel-body p-t-15">
          <h3 id="CUR-HyTKCwnY">Import is processing...</h3>
          <div id="CUR-dslouhvq" class="loading-spinner">
            <md-progress-circular md-diameter="95"></md-progress-circular>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Error Page -->
<div id="CUR-aigePGBE" class="container-fluid container-fixed-lg" ng-if="import.status == 'Errored'">
  <div id="CUR-VdHXKrvq" class="row">
    <div id="CUR-tgtvEvfH" class="col-xs-12 col-sm-6 col-sm-offset-3">
      <div id="CUR-ngCPLuId" class="panel panel-default text-center">
        <div id="CUR-gKWbMuPX" class="panel-body p-t-15">
          <h3 id="CUR-hXFEjCap">Import has Errored</h3>
          <div id="CUR-JyQpyIkc" class="row">
            <div id="CUR-kfCejoLi" class="col-xs-10 col-xs-offset-1 progress-checklist text-left">
              <p>{{import.calculationError}}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
