<div id="CUR-UvrWLHHS" class="jumbotron" data-pages="parallax">
  <div id="CUR-xWHWSSTr" class="container-fluid container-fixed-lg sm-p-l-20 sm-p-r-20">
    <div id="CUR-crRQXPEf" class="inner">
      <ul id="CUR-OyZJCXQP" class="breadcrumb">
        <li id="CUR-FlTuoFcl">
          <a id="CUR-pDraNGOJ" href="/#/imports" class="active">Imports</a>
        </li>
      </ul>
    </div>
  </div>
</div>
<!-- Main Container -->
<div id="CUR-zSCLPOWt" class="container-fluid container-fixed-lg">
  <!-- Search and Buttons -->
  <div id="CUR-BHRbbBnS" class="row m-b-20">
    <div id="CUR-KaVDrOEY" class="col-sm-12 col-md-4 col-md-offset-1 col-lg-4 col-lg-offset-2">
      <form id="CUR-EEGHFvQy" class="sm-p-l-15 sm-p-r-15" ng-submit="search()">
        <div id="CUR-bZXazjlJ" class="input-group transparent">
          <input id="CUR-rpkdncvn" type="text" class="form-control" placeholder="Search" ng-model="filter.text">
          <span id="CUR-XRoeRWPE" class="input-group-addon pointer" ng-click="search()">
            <i class="pg-search"></i>
          </span>
        </div>
      </form>
    </div>
    <div id="CUR-xJajqwUG" class="col-sm-12 col-md-6 col-md-offset-1 col-lg-6 col-md-offset-0 text-right">
      <div id="CUR-IevbIqmn" class="sm-p-l-15 sm-p-r-15">
        <button id="CUR-RtvJHZzy" class="btn btn-danger hidden-xs" data-toggle="modal" data-target="#deleteModal">
          <i class="fa fa-trash"></i>&nbsp;Delete</button>
        <a id="CUR-SEqjhIWi" href="/#/imports/new" ng-if="!demoMode">
          <button id="CUR-JqtYgYOW" class="btn btn-complete w-xs-100-p m-xs-l-0" ng-click="createNewImport()">
            <i class="fa fa-plus"></i>&nbsp;Create</button>
        </a>
      </div>
    </div>
  </div>
  <div id="CUR-PaYSEMnb" class="col-sm-12">
      <h5 id="CUR-IYtKIyyA" class="pull-right">Total: {{total? total : 0}}</h5>
    </div>
  <div id="CUR-dZDodSsf" class="row">
    <div id="CUR-hNAnojVy" class="col-xs-12">
      <div id="CUR-IQiwOqmC" class="panel panel-default">
        <div id="CUR-EduSFIaM" class="panel-heading">
          <div id="CUR-BeaUPKwL" class="panel-title">
            Imports <documentation link="http://guide.curveroyaltysystems.com/article/settings/#imports"></documentation>
          </div>
        </div>
        <div id="CUR-eOoZGiFr" class="panel-body">
          <div id="CUR-xFFnFzvJ" class="table-responsive">
            <table id="CUR-yRcZgUQg" class="table table-hover table-condensed dataTable no-footer">
              <thead>
                <tr id="CUR-LbJJPtyJ">
                  <th class="table-checkbox hidden-xs">
                    <input id="CUR-hhfHhrGY" type="checkbox" class="select-all" ng-click="selectAll(imports)">
                  </th>
                  <th ng-click="getSortedData('name')" ng-class="whatClassIsIt('name')">Name</th>
                  <th ng-click="getSortedData('createdAt')" ng-class="whatClassIsIt('createdAt')">Created</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="CUR-VUwkxWUp">
                <tr import-table-row ng-repeat="import in imports" index="{{$index}}" import="import"></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="CUR-UadVSXdc" class="col-sm-12">
      <div id="CUR-WPCxUGea" class="pull-right">
        <span id="CUR-WKOrdsJb" class="inline-block" ng-if="!isShowingAll">Showing 25 Per Page  |</span>
        <a id="CUR-JrtywuKD" class="p-l-5" ng-if="!isShowingAll" ng-click="showAll()">Show 500</a>
      </div>
    </div>
  <div id="CUR-FuZQTZeI" ng-if="!isShowingAll" class="row">
    <div id="CUR-kAyRxYbn" class="col-xs-12 text-center">
      <pagination id="CUR-wwrHFzhp" pages="pages" total="totalPages" current="currentPage" change-page="changePage(page)"></pagination>
    </div>
  </div>
</div>

<div class="modal fade stick-up" id="deleteModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div id="CUR-KYmtndfi" class="modal-dialog">
    <div id="CUR-LEzUGJKX" class="modal-content">
      <div id="CUR-bGUUomlb" class="modal-header clearfix text-left">
        <button id="CUR-VmVJpcOG" type="button" class="close" data-dismiss="modal" aria-hidden="true">
          <i class="pg-close fs-14"></i>
        </button>
        <h5 id="CUR-NWhuSZoB">Delete Imports</h5>
      </div>
      <div id="CUR-MmMpdsJg" class="modal-body">
        <div id="CUR-kPqdgxOZ" class="row">
          <div id="CUR-hiTriifV" class="col-xs-12 m-t-20">
            <p>Are you sure you want to delete the selected imports? This cannot be undone.</p>
          </div>
        </div>
        <div id="CUR-krUFQwnH" class="row">
          <div id="CUR-ERUwFJyi" class="col-xs-12 m-t-20 text-right">
            <button id="CUR-zKEOUvKT" type="button" class="btn btn-default m-t-5" data-dismiss="modal">Cancel</button>
            <button id="CUR-OvliGFEF" type="button" class="btn btn-danger m-t-5" ng-click="deleteSelected()">
              <i class="fa fa-trash"></i>&nbsp;Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
