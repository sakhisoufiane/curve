  <div id="CUR-QAhVKqFC" class="row">

      <div id="CUR-nCeHssuI" class="panel panel-default">

            Accounting Periods
          </div>
        </div>
        <div id="CUR-HfrnkhFU" class="panel-body">

                  <th ng-click="getSortedData('name')" ng-class="whatClassIsIt('name')">Name</th>
                  <th ng-click="getSortedData('year')" ng-class="whatClassIsIt('year')">Year</th>
                  <th ng-click="getSortedData('accountingPeriod')" ng-class="whatClassIsIt('accountingPeriod')">Period</th>
                  <th ng-click="getSortedData('grossAmount')" ng-class="whatClassIsIt('grossAmount')">Gross Sales</th>
                  <th ng-click="getSortedData('createdAt')" ng-class="whatClassIsIt('createdAt')">Created</th>
                  <th ng-click="getSortedData('status')" ng-class="whatClassIsIt('status')">Status</th>
                </tr>
              </thead>
              <tbody id="CUR-NcjRhXDJ">
                <tr accounting-period-table-row ng-repeat="period in accountingPeriods" index="{{$index}}" period="period" client-type="clientType"></tr>

            </table>

  </div>
<div id="CUR-wwGtqkzg" class="row">
  <div id="CUR-SeoJcsIa" class="col-xs-12 text-center">

  </div>
</div>
</div>

</div>
