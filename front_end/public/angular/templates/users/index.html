<div id="CUR-bwIfNMWh" class="jumbotron" data-pages="parallax">
  <div id="CUR-ceUCDEpF" class="container-fluid container-fixed-lg sm-p-l-20 sm-p-r-20">
    <div id="CUR-FRIiVWAw" class="inner">
      <ul id="CUR-EEMnYbkt" class="breadcrumb">
        <li id="CUR-uRsAWOol"><a id="CUR-JYEsQXbO" href="/#/users" class="active">Users</a></li>
      </ul>
    </div>
  </div>
</div>
<!-- Main Container -->
<div id="CUR-dBqodcLy" class="container-fluid container-fixed-lg">
  <!-- Search and Buttons -->
  <div id="CUR-HNXICImE" class="row m-b-20">
    <div id="CUR-vxMAnRob" class="col-sm-12 col-md-4 col-md-offset-1 col-lg-4 col-lg-offset-2">
      <form id="CUR-sOkaQWcI" class="sm-p-l-15 sm-p-r-15" ng-submit="search()">
        <div id="CUR-FbLxThKp" class="input-group transparent">
          <input id="CUR-nPGReBdA" type="text" class="form-control" placeholder="Search" ng-model="filter.text">
          <span id="CUR-GzTZdmwm" class="input-group-addon pointer" ng-click="search()">
            <i class="pg-search"></i>
          </span>
        </div>
      </form>
    </div>
    <div id="CUR-atymDADC" class="col-sm-12 col-md-6 col-md-offset-1 col-lg-6 col-md-offset-0 text-right">
      <div id="CUR-xAmaIPOg" class="sm-p-l-15 sm-p-r-15">
        <button id="CUR-SOwqGGzx" class="btn btn-default hidden-xs" data-toggle="modal" data-target="#importModal"><i
            class="fa fa-download"></i>&nbsp;Import</button>
        <button id="CUR-amaBqJyZ" class="btn btn-default hidden-xs" ng-click="export()"><i class="fa fa-upload"></i>&nbsp;Export</button>
        <button id="CUR-RWlxftDS" class="btn btn-danger hidden-xs" data-toggle="modal" data-target="#deleteModal" ng-if="!demoMode && (adminType == 'Admin' || internalUser || parentUser) && userType != 'payee'"><i
            class="fa fa-trash"></i>&nbsp;Delete</button>
        <a id="CUR-rocbzyfk" href="/#/users/new" ng-if="!demoMode && (adminType == 'Admin' || internalUser || parentUser) && userType != 'payee'">
          <button id="CUR-MEXvNKZp" class="btn btn-complete w-xs-100-p m-xs-l-0" ng-click="createNewUser()"><i
              class="fa fa-plus"></i>&nbsp;Create</button>
        </a>
      </div>
    </div>
  </div>
  <div id="CUR-gGVWllyR" class="col-sm-12">
    <h5 id="CUR-IJtrqhVW" class="pull-right">Total: {{total? total : 0}}</h5>
  </div>
  <div id="CUR-DkhRBcgy" class="row">
    <div id="CUR-PWjwZfcA" class="col-xs-12">
      <div id="CUR-xBOYUQqD" class="panel panel-default">
        <div id="CUR-YeWZkkks" class="panel-heading">
          <div id="CUR-jpCBXdGb" class="panel-title">
            Users <documentation
              link="http://guide.curveroyaltysystems.com/article/users-granting-3rd-party-access/#newusers">
            </documentation>
          </div>
        </div>
        <div id="CUR-wolxgfJt" class="panel-body">
          <div id="CUR-felYBGVK" class="table-responsive">
            <table id="CUR-AArHwreX" class="table table-hover table-condensed dataTable no-footer">
              <thead>
                <tr id="CUR-pkmqEfFc">
                  <th class="table-checkbox hidden-xs"><input id="CUR-njhsFFcZ" type="checkbox" class="select-all"
                      ng-click="selectAll(users)"></th>
                  <th ng-click="getSortedData('email')" ng-class="whatClassIsIt('email')">Email</th>
                  <th ng-click="getSortedData('createdAt')" ng-class="whatClassIsIt('createdAt')" class="hidden-xs">
                    Created</th>
                  <th ng-click="getSortedData('lastLogin')" ng-class="whatClassIsIt('lastLogin')" class="hidden-xs">Last
                    Login</th>
                  <th ng-click="getSortedData('status')" ng-class="whatClassIsIt('status')">Status</th>
                </tr>
              </thead>
              <tbody id="CUR-tLNaUhsg">
                <tr user-table-row ng-repeat="user in users" index="{{$index}}" user="user"></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="CUR-suaIeoAd" class="col-sm-12">
    <div id="CUR-DThvoQMB" class="pull-right">
      <span id="CUR-PTrOxefZ" class="inline-block" ng-if="!isShowingAll">Showing 25 Per Page  |</span>
      <span id="CUR-aXpOfQoo" class="inline-block" ng-if="isShowingAll">Showing {{filter.limit}} Per Page</span>
      <a id="CUR-rrywAKlb" class="p-l-5" ng-if="!isShowingAll" ng-click="showAll()">Show 500</a>
    </div>
  </div>
  <div id="CUR-gNPPWBTY" class="row">
    <div id="CUR-RSPQoity" class="col-xs-12 text-center">
      <pagination id="CUR-TsnTXcRp" pages="pages" total="totalPages" current="currentPage" change-page="changePage(page)"></pagination>
    </div>
  </div>
</div>

<div class="modal fade stick-up" id="deleteModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div id="CUR-qWNZnSRz" class="modal-dialog">
    <div id="CUR-JTxGOUxQ" class="modal-content">
      <div id="CUR-QimmyFGD" class="modal-header clearfix text-left">
        <button id="CUR-ZapocxAu" type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="pg-close fs-14"></i>
        </button>
        <h5 id="CUR-jDWzqsow">Delete Users</h5>
      </div>
      <div id="CUR-XJIavHMv" class="modal-body">
        <div id="CUR-ECywzkjf" class="row">
          <div id="CUR-WPwSmHhS" class="col-xs-12 m-t-20">
            <p>Are you sure you want to delete the selected users? This cannot be undone.</p>
          </div>
        </div>
        <div id="CUR-vydMfYIu" class="row">
          <div id="CUR-wcCsarGH" class="col-xs-12 m-t-20 text-right">
            <button id="CUR-bpWPoGcF" type="button" class="btn btn-default m-t-5" data-dismiss="modal">Cancel</button>
            <button id="CUR-qmXpxFpo" type="button" class="btn btn-danger m-t-5" ng-click="deleteSelected()"><i
                class="fa fa-trash"></i>&nbsp;Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade stick-up" id="importModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div id="CUR-UigHeOzZ" class="modal-dialog">
    <div id="CUR-EVMaekOa" class="modal-content">
      <div id="CUR-rvSLGNRi" class="modal-header clearfix text-left">
        <button id="CUR-NtIEmYcE" type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="pg-close fs-14"></i>
        </button>
        <h5 id="CUR-DgIddELx">Import Users</h5>
      </div>
      <div id="CUR-FMEBByNk" class="modal-body">
        <div id="CUR-TTifWJpI" class="row">
          <div id="CUR-fxPPjpDz" class="col-xs-12 m-t-20">
            <form id="CUR-ssXaOQDk">
              <div id="CUR-HMvFjfWG" class="form-group">
                <label id="CUR-BsVbcEzK" for="file">File</label>
                <input id="CUR-FSXEzMpo" type="file" ng-model="importFile" ngf-select>
              </div>
            </form>
          </div>
        </div>
        <div id="CUR-fiKwbqTx" class="row" ng-if="importErrors">
          <div id="CUR-CYPbnnrY" class="col-sm-12">
            <ul id="CUR-fZeweraG">
              <li id="CUR-UGqfgaIi" ng-repeat="error in importErrors track by $index">{{ error }}</li>
            </ul>
          </div>
        </div>
        <div id="CUR-CGDgYBiT" class="row">
          <div id="CUR-pbOxyuJP" class="col-xs-12 m-t-20 text-right">
            <a id="CUR-OqXMJkBW" class="btn btn-success m-t-5" ng-click="downloadTemplate()">Download Template</a>
            <button id="CUR-iOlxkNkb" type="button" class="btn btn-default m-t-5" data-dismiss="modal">Cancel</button>
            <button id="CUR-Zqntqeig" type="button" class="btn btn-complete m-t-5" ng-click="import()"><i
                class="fa fa-download"></i>&nbsp;Import</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
