version: 0.2

env:
  secrets-manager:
    DOCKER_ACCOUNT_PASS: DOCKER_PASSWORD:CURVEROYALTYSYSTEMS
    NPM_TOKEN: NPM_TOKEN:CURVEPRODUCTION
    GIT_TOKEN: GIT_TOKEN:GIT_TOKEN
    API_URL: API_URL:API_URL

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 238239381222.dkr.ecr.eu-west-1.amazonaws.com
      - REPOSITORY_URI=238239381222.dkr.ecr.eu-west-1.amazonaws.com/frontend-release
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Cloning git submodules manually since source is from S3..."
      - git clone https://$GIT_TOKEN@github.com/CurveRoyalties/front_end.git apps/front_end
      - cd apps/front_end && git checkout CUR-4608-react-frontend-changes && cd ../..
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker login --username curveroyaltysystems --password $DOCKER_ACCOUNT_PASS
      - docker build -f apps/curve-app/Dockerfile --build-arg VITE_API_URL=$API_URL --build-arg VITE_APPLICATION_TOKEN="DrLmNC2q9t" --build-arg NPM_TOKEN=$NPM_TOKEN -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Writing image definitions file...
      - printf '[{"name":"frontend-release","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
artifacts:
  files: imagedefinitions.json