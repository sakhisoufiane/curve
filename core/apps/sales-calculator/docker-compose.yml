version: '3.8'

services:
  sales-calculator:
    image: sales-calculator:latest
    container_name: sales-calculator
    env_file:
      - .env
    environment:
      - batchTaskId=685e56ae4d81f7473dd81ea9
    ports:
      - "3000:3000"
    # Add healthcheck to ensure the service is running properly
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 