name: Preview Deployments

on:
  pull_request:
    branches: ["main"]

jobs:
  changed-packages:
    name: Detect Changed Packages
    uses: ./.github/workflows/detect-changes.yml

  preview-storybook:
    name: Preview - Storybook
    needs: [changed-packages]
    if: needs.changed-packages.outputs.package_react_ui_library_changed == 'true'
    uses: ./.github/workflows/deploy-storybook.yml
    secrets: inherit
